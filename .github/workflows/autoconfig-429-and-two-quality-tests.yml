name: Auto config 429 fresh tests

on:
  workflow_dispatch:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/**/*oauth*'
      - 'backend/internal/service/scheduled_test*'
      - 'backend/internal/service/account_test*'
      - 'backend/internal/repository/http_upstream.go'
      - 'backend/migrations/*oauth_429*'
      - 'frontend/src/components/admin/operations/OAuthDegradationCard.vue'
      - 'frontend/src/utils/oauthDegradation.ts'
      - 'frontend/src/i18n/locales/*/autoConfig.ts'
      - 'frontend/src/views/admin/__tests__/OAuthDegradationActions.spec.ts'
      - '.github/scripts/oauth-429-independent-browser.mjs'
      - 'backend/internal/pkg/upstreamstats/**'
      - '.github/workflows/autoconfig-429-and-two-quality-tests.yml'
      - '.github/scripts/assert-test-log-clean.sh'

permissions:
  contents: read

concurrency:
  group: autoconfig-429-fresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This first increment verifies the no-direct-action guard. Dedicated worker,
# handler and loopback-provider acceptance must be added before this draft is ready.
jobs:
  no-direct-action:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 8678e88f4dfb6bfb718993db8a2a15b4a6af8282
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: candidate/backend/go.mod
          cache-dependency-path: candidate/backend/go.sum
      - name: Baseline must fail the unchanged behavior oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C candidate rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git -C candidate rev-parse HEAD > evidence/candidate-head.txt
          git -C baseline rev-parse HEAD > evidence/baseline-head.txt
          oracle=backend/internal/repository/oauth_degradation_429_fresh_integration_test.go
          cp "candidate/$oracle" "baseline/$oracle"
          cmp "candidate/$oracle" "baseline/$oracle"
          sha256sum "candidate/$oracle" "baseline/$oracle" > evidence/oracle-sha256.txt
          set +e
          (cd baseline/backend && go test -tags=integration ./internal/repository -run '^TestOAuth429RequiresFreshIndependentTestsBeforeAction$' -count=1 -v -timeout=15m) > evidence/red.log 2>&1
          result=$?
          set -e
          cat evidence/red.log
          printf '%s\n' "$result" > evidence/red-exit.txt
          test "$result" -ne 0
          bash candidate/.github/scripts/assert-test-log-clean.sh red evidence/red.log
          grep -F '429 pressure and historical wrong answers must not authorize degradation before two fresh independent tests' evidence/red.log
          grep -F -- '--- FAIL: TestOAuth429RequiresFreshIndependentTestsBeforeAction/no_quality_plan' evidence/red.log
          grep -F -- '--- FAIL: TestOAuth429RequiresFreshIndependentTestsBeforeAction/historical_wrong_results' evidence/red.log
      - name: Candidate behavior and existing ordinary probe review
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate/backend && go test -race -tags=integration ./internal/repository -run '^TestOAuth429RequiresFreshIndependentTestsBeforeAction$|^TestOAuthDegradationCandyReviewUsesCurrentRule$' -count=1 -v -timeout=15m) 2>&1 | tee evidence/green.log
          bash candidate/.github/scripts/assert-test-log-clean.sh green evidence/green.log
          grep -F -- '--- PASS: TestOAuth429RequiresFreshIndependentTestsBeforeAction/no_quality_plan' evidence/green.log
          grep -F -- '--- PASS: TestOAuth429RequiresFreshIndependentTestsBeforeAction/historical_wrong_results' evidence/green.log
          grep -F -- '--- PASS: TestOAuthDegradationCandyReviewUsesCurrentRule ' evidence/green.log
      - name: Production build without test tags
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate/backend && go build -o "$RUNNER_TEMP/sub2api-429-candidate" ./cmd/server) 2>&1 | tee evidence/build.log
          sha256sum "$RUNNER_TEMP/sub2api-429-candidate" > evidence/build-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-fresh-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error

  independent-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Negative control rejects disconnected production worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          source=backend/internal/service/oauth_429_worker.go
          cp "$source" "$RUNNER_TEMP/oauth429-worker.go"
          trap 'cp "$RUNNER_TEMP/oauth429-worker.go" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/internal/service/oauth_429_worker.go')
          s=p.read_text()
          needle='func (s *ScheduledTestRunnerService) startOAuth429() {'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+'\n if true { return }',1))
          PY
          set +e
          (cd backend && go test -tags=integration ./internal/repository -run '^TestOAuth429HTTPTransportDeduplicatesAndWakesWorker$' -count=1 -v -timeout=10m) > evidence/disconnected-worker-red.log 2>&1
          result=$?
          set -e
          cat evidence/disconnected-worker-red.log
          test "$result" -ne 0
          bash .github/scripts/assert-test-log-clean.sh red evidence/disconnected-worker-red.log
          grep -F -- '--- FAIL: TestOAuth429HTTPTransportDeduplicatesAndWakesWorker' evidence/disconnected-worker-red.log
          grep -F 'Condition never satisfied' evidence/disconnected-worker-red.log
      - name: Real PostgreSQL and loopback provider worker lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/worker-head.txt
          (cd backend && go test -race -tags=integration ./internal/repository -run '^TestOAuth429Worker|^TestOAuth429Persistent|^TestOAuth429HTTP|^TestOAuth429Alias' -count=1 -v -timeout=20m) 2>&1 | tee evidence/worker.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429WorkerIndependentPair/qualityops_off_two_wrong' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429WorkerIndependentPair/history_wrong_cannot_shortcut' evidence/worker.log
      - name: Real settings handler validation
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/handler/admin -run '^TestOAuthAutoConfig.*Degradation|^Test.*Degradation' -count=1 -v) 2>&1 | tee evidence/handler.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/handler.log
          (cd backend && go test -race -tags=integration ./internal/handler/admin -run '^TestOAuth429HandlerPostgresWorkerLoopback$' -count=1 -v -timeout=10m) 2>&1 | tee evidence/handler-worker.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/handler-worker.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  configuration-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Real settings component and feature notice regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          pnpm --dir frontend exec vitest run src/views/admin/__tests__/OAuthDegradationActions.spec.ts src/stores/__tests__/newFeatureNotices.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee evidence/ui-tests.log
          pnpm --dir frontend typecheck 2>&1 | tee evidence/ui-types.log
          pnpm --dir frontend exec eslint src/components/admin/operations/OAuthDegradationCard.vue src/utils/oauthDegradation.ts 2>&1 | tee evidence/ui-lint.log
      - name: Real desktop/mobile baseline and current rendering
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/oauth-browser/node_modules/playwright
          OAUTH_DEGRADATION_SCREENSHOT_DIR: ${{ github.workspace }}/evidence/screenshots
        run: |
          git fetch --no-tags --depth=1 origin 8678e88f4dfb6bfb718993db8a2a15b4a6af8282
          npm install --prefix "$RUNNER_TEMP/oauth-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/oauth-browser/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/oauth-429-independent-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
