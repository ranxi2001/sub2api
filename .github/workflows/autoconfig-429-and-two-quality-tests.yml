name: Auto config 429 fresh tests

on:
  workflow_dispatch:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/**/*oauth*'
      - 'backend/internal/service/scheduled_test*'
      - 'backend/internal/service/account_test*'
      - 'backend/internal/repository/http_upstream.go'
      - 'backend/migrations/*oauth_429*'
      - 'frontend/src/components/admin/operations/OAuthDegradationCard.vue'
      - 'frontend/src/utils/oauthDegradation.ts'
      - 'frontend/src/i18n/locales/*/autoConfig.ts'
      - 'frontend/src/views/admin/__tests__/OAuthDegradationActions.spec.ts'
      - 'frontend/src/views/admin/__tests__/OAuth429RealNoticeEntrypoints.spec.ts'
      - '.github/scripts/oauth-429-independent-browser.mjs'
      - 'backend/internal/pkg/upstreamstats/**'
      - '.github/workflows/autoconfig-429-and-two-quality-tests.yml'
      - '.github/scripts/assert-test-log-clean.sh'

permissions:
  contents: read

concurrency:
  group: autoconfig-429-fresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Guard RED/GREEN at 7990f8da2 is retained historical evidence. This workflow
# verifies current behavior and the newly repaired observation boundaries.
jobs:
  no-direct-action:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sub2api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sub2api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      SUB2API_TEST_POSTGRES_DSN: 'postgres://postgres:postgres@127.0.0.1:5432/sub2api_test?sslmode=disable&TimeZone=UTC'
      SUB2API_TEST_REDIS_URL: 'redis://127.0.0.1:6379/0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: candidate/backend/go.mod
          cache-dependency-path: candidate/backend/go.sum
      - name: Candidate behavior and existing ordinary probe review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C candidate rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git -C candidate rev-parse HEAD > evidence/candidate-head.txt
          (cd candidate/backend && go test -race -tags=integration ./internal/repository -run '^TestOAuth429RequiresFreshIndependentTestsBeforeAction$|^TestOAuthDegradationCandyReviewUsesCurrentRule$' -count=1 -v -timeout=15m) 2>&1 | tee evidence/green.log
          bash candidate/.github/scripts/assert-test-log-clean.sh green evidence/green.log
          grep -F -- '--- PASS: TestOAuth429RequiresFreshIndependentTestsBeforeAction/no_quality_plan' evidence/green.log
          grep -F -- '--- PASS: TestOAuth429RequiresFreshIndependentTestsBeforeAction/historical_wrong_results' evidence/green.log
          grep -F -- '--- PASS: TestOAuthDegradationCandyReviewUsesCurrentRule ' evidence/green.log
      - name: Production build without test tags
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate/backend && go build -o "$RUNNER_TEMP/sub2api-429-candidate" ./cmd/server) 2>&1 | tee evidence/build.log
          sha256sum "$RUNNER_TEMP/sub2api-429-candidate" > evidence/build-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-fresh-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error

  independent-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/checkout@v6
        with:
          ref: ee16421fb2d7e7ec87aabe18ffbcd90fa2281ec3
          path: repair-baseline
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 64082916cf88ef727f5772cb393ccb4655de0683
          path: normalization-baseline
          persist-credentials: false
      - name: Same transport oracle rejects the reviewed normalization regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Reviewed640 contains the same unrelated unused-variable compiler
          # defect fixed in26837ecc8. Apply only that fixture repair so RED can
          # reach its named behavior assertion; retain the exact baseline diff.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('normalization-baseline/backend/internal/repository/oauth_429_metadata_integration_test.go')
          s=p.read_text()
          old='func TestOAuth429HTTPWithoutResponseDoesNotSample(t *testing.T) {\n\trepo, a, _ := oauth429Fixture(t, nil)'
          new=old.replace('repo, a, _ :=', '_, a, _ :=')
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          git -C normalization-baseline diff -- backend/internal/repository/oauth_429_metadata_integration_test.go > evidence/normalization-baseline-compile-compat.patch
          oracle=backend/internal/repository/oauth_429_normalization_integration_test.go
          cp "$oracle" "normalization-baseline/$oracle"
          cmp "$oracle" "normalization-baseline/$oracle"
          sha256sum "$oracle" "normalization-baseline/$oracle" > evidence/normalization-oracle-sha256.txt
          git -C normalization-baseline rev-parse HEAD > evidence/normalization-baseline-head.txt
          set +e
          (cd normalization-baseline/backend && go test -tags=integration ./internal/repository -run '^TestOAuth429HTTPForwardNormalization$' -count=1 -v -timeout=10m) > evidence/normalization-red.log 2>&1
          result=$?
          set -e
          cat evidence/normalization-red.log
          test "$result" -ne 0
          bash .github/scripts/assert-test-log-clean.sh red evidence/normalization-red.log
          grep -F 'Forward-normalized model must complete five consecutive 429 tests and apply the configured whitelist' evidence/normalization-red.log
          grep -F -- '--- FAIL: TestOAuth429HTTPForwardNormalization/provider_prefix' evidence/normalization-red.log
          grep -F -- '--- FAIL: TestOAuth429HTTPForwardNormalization/wildcard_to_prefix' evidence/normalization-red.log
      - name: Reviewed head deduplication and account transition behavioral RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          oracle=backend/internal/repository/oauth_429_observation_fences_integration_test.go
          cp "$oracle" "repair-baseline/$oracle"
          cmp "$oracle" "repair-baseline/$oracle"
          sha256sum "$oracle" "repair-baseline/$oracle" > evidence/repair-oracle-sha256.txt
          git -C repair-baseline rev-parse HEAD > evidence/repair-baseline-head.txt
          set +e
          (cd repair-baseline/backend && go test -tags=integration ./internal/repository -run '^TestOAuth429DedupSurvivesStatisticalWindowEviction$|^TestOAuth429QueuedObservationCannotCrossAccountTransition$' -count=1 -v -timeout=10m) > evidence/repair-red.log 2>&1
          result=$?
          set -e
          cat evidence/repair-red.log
          test "$result" -ne 0
          bash .github/scripts/assert-test-log-clean.sh red evidence/repair-red.log
          grep -F 'evicted business retry must not become the 160th independent failing sample' evidence/repair-red.log
          grep -F 'queued old-epoch sample must be rejected even after the account becomes schedulable again' evidence/repair-red.log
          grep -F -- '--- FAIL: TestOAuth429DedupSurvivesStatisticalWindowEviction' evidence/repair-red.log
          grep -F -- '--- FAIL: TestOAuth429QueuedObservationCannotCrossAccountTransition' evidence/repair-red.log
      - uses: actions/checkout@v6
        with:
          ref: 8678e88f4dfb6bfb718993db8a2a15b4a6af8282
          path: worker-production-baseline
          persist-credentials: false
      - name: Same complete worker behavior oracle on old production
        shell: bash
        run: |
          set -euo pipefail
          oracle=backend/internal/repository/oauth_429_immediate_oracle_integration_test.go
          cp "$oracle" "worker-production-baseline/$oracle"
          cmp "$oracle" "worker-production-baseline/$oracle"
          sha256sum "$oracle" "worker-production-baseline/$oracle" > evidence/full-worker-oracle-sha256.txt
          git -C worker-production-baseline rev-parse HEAD > evidence/full-worker-baseline-head.txt
          set +e
          (cd worker-production-baseline/backend && go test -tags=integration ./internal/repository -run '^TestOAuth429ImmediateWithoutQualityOpsBehaviorOracle$' -count=1 -v -timeout=10m) > evidence/full-worker-red.log 2>&1
          result=$?
          set -e
          cat evidence/full-worker-red.log
          test "$result" -ne 0
          bash .github/scripts/assert-test-log-clean.sh red evidence/full-worker-red.log
          grep -F 'threshold must immediately execute two independent provider tests with qualityops disabled and no plan' evidence/full-worker-red.log
          grep -F -- '--- FAIL: TestOAuth429ImmediateWithoutQualityOpsBehaviorOracle' evidence/full-worker-red.log
      - name: Negative control rejects disconnected production worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          source=backend/internal/service/oauth_429_worker.go
          cp "$source" "$RUNNER_TEMP/oauth429-worker.go"
          trap 'cp "$RUNNER_TEMP/oauth429-worker.go" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/internal/service/oauth_429_worker.go')
          s=p.read_text()
          needle='func (s *ScheduledTestRunnerService) startOAuth429() {'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+'\n if true { return }',1))
          PY
          set +e
          (cd backend && go test -tags=integration ./internal/repository -run '^TestOAuth429HTTPTransportDeduplicatesAndWakesWorker$' -count=1 -v -timeout=10m) > evidence/disconnected-worker-red.log 2>&1
          result=$?
          set -e
          cat evidence/disconnected-worker-red.log
          test "$result" -ne 0
          bash .github/scripts/assert-test-log-clean.sh red evidence/disconnected-worker-red.log
          grep -F -- '--- FAIL: TestOAuth429HTTPTransportDeduplicatesAndWakesWorker' evidence/disconnected-worker-red.log
          grep -F 'Condition never satisfied' evidence/disconnected-worker-red.log
      - name: Real PostgreSQL and loopback provider worker lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/worker-head.txt
          (cd backend && go test -race -tags=integration ./internal/repository -run '^TestOAuth429Worker|^TestOAuth429ReviewUsesSelectedAccountActions$|^TestOAuth429Persistent|^TestOAuth429HTTP|^TestOAuth429Compact|^TestOAuth429ActualAlias|^TestOAuth429Immediate|^TestOAuth429Alias|^TestOAuth429Dedup|^TestOAuth429Queued|^TestOAuth429AccountEpoch|^TestOAuth429Expiry|^TestOAuth429First' -count=1 -v -timeout=20m) 2>&1 | tee evidence/worker.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429WorkerIndependentPair/qualityops_off_two_wrong' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429WorkerIndependentPair/history_wrong_cannot_shortcut' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429DedupSurvivesStatisticalWindowEviction' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429QueuedObservationCannotCrossAccountTransition' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429ImmediateWithoutQualityOpsBehaviorOracle' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429HTTPParsedModelSurvivesStreamingAndLargeBody' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429HTTPForwardNormalization' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429CompactGlobalForwardWorker' evidence/worker.log
          grep -F -- '--- PASS: TestOAuth429CompactRoutingChangeFencesEveryStage' evidence/worker.log
      - name: Real settings handler validation
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -tags=unit ./internal/service -run '^TestOAuth429' -count=1 -v) 2>&1 | tee evidence/classifier.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/classifier.log
          grep -F -- '--- PASS: TestOAuth429RealForwardNormalization' evidence/classifier.log
          grep -F -- '--- PASS: TestOAuth429EndpointResolution' evidence/classifier.log
          grep -F -- '--- PASS: TestOAuth429CompactGlobalForwardAndAdmission' evidence/classifier.log
          (cd backend && go test -tags=unit ./internal/handler -run '^TestOAuth429ParsedInputModelAndIdentitySurviveHTTPContext$' -count=1 -v) 2>&1 | tee evidence/model-context.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/model-context.log
          (cd backend && go test -tags=unit ./internal/handler/admin -run '^TestOAuthAutoConfig.*Degradation|^Test.*Degradation' -count=1 -v) 2>&1 | tee evidence/handler.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/handler.log
          (cd backend && go test -race -tags=integration ./internal/handler/admin -run '^TestOAuth429HandlerPostgresWorkerLoopback$' -count=1 -v -timeout=10m) 2>&1 | tee evidence/handler-worker.log
          bash .github/scripts/assert-test-log-clean.sh green evidence/handler-worker.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  configuration-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Real settings component and feature notice regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          pnpm --dir frontend exec vitest run src/views/admin/__tests__/OAuthDegradationActions.spec.ts src/views/admin/__tests__/OAuth429RealNoticeEntrypoints.spec.ts src/stores/__tests__/newFeatureNotices.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee evidence/ui-tests.log
          pnpm --dir frontend typecheck 2>&1 | tee evidence/ui-types.log
          pnpm --dir frontend exec eslint src/components/admin/operations/OAuthDegradationCard.vue src/utils/oauthDegradation.ts 2>&1 | tee evidence/ui-lint.log
      - name: Real desktop/mobile baseline and current rendering
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/oauth-browser/node_modules/playwright
          OAUTH_DEGRADATION_SCREENSHOT_DIR: ${{ github.workspace }}/evidence/screenshots
        run: |
          git fetch --no-tags --depth=1 origin 8678e88f4dfb6bfb718993db8a2a15b4a6af8282
          npm install --prefix "$RUNNER_TEMP/oauth-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/oauth-browser/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/oauth-429-independent-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoconfig-429-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
