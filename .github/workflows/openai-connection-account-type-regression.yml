name: OpenAI connection account type regression

on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/service/openai_auth_connection*.go'
      - 'backend/internal/handler/admin/openai_auth_connections*.go'
      - 'backend/internal/repository/openai_auth_connections*test.go'
      - 'frontend/src/components/account/**'
      - 'frontend/src/api/admin/openaiAuthConnections.ts'
      - '.github/workflows/openai-connection-account-type-regression.yml'
      - '.github/scripts/openai-connection-account-type-proof.py'

permissions:
  contents: read

concurrency:
  group: openai-connection-type-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [red, green]
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE: cf3d30c69ea997d15a5d714805d5b6ad2901463f
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prove source identity and keep head tests
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD
          mkdir -p "$RUNNER_TEMP/connection-proof"
          if [ "$MODE" = red ]; then
            git restore --source="$BASELINE" --worktree -- \
              backend/internal/service/openai_auth_connections.go \
              backend/internal/service/openai_auth_connection_oauth.go \
              backend/internal/service/openai_auth_connection_legacy.go \
              backend/internal/service/openai_auth_connection_routing.go
            # The new status endpoint compiles with a management helper absent
            # from this old baseline. Retain that exact helper only: the restored
            # List/Create methods still run their historical account-type logic.
            python3 - <<'PYCODE'
          import pathlib, re, subprocess
          source = subprocess.check_output(['git', 'show', 'HEAD:backend/internal/service/openai_auth_connections.go'], text=True)
          helper = re.search(r'func \(s \*OpenAIOAuthReauthService\) managementConnectionAccount\(.*?
\}', source, re.S)
          assert helper is not None
          target = pathlib.Path('backend/internal/service/connection_type_red_compat.go')
          assert not target.exists()
          target.write_text('package service\nimport ("context"; infraerrors "github.com/Wei-Shaw/sub2api/internal/pkg/errors")\n' + helper.group(0) + '\n')
          PYCODE
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/connection-proof/head.txt"
          git diff --name-only | tee "$RUNNER_TEMP/connection-proof/restored-paths.txt"
          git diff --exit-code HEAD -- '*test.go'
          git hash-object backend/internal/service/openai_auth_connections.go | tee "$RUNNER_TEMP/connection-proof/source-blob.txt"
          if [ "$MODE" = red ]; then
            test "$(git hash-object backend/internal/service/openai_auth_connections.go)" = "$(git rev-parse "$BASELINE:backend/internal/service/openai_auth_connections.go")"
          fi
      - name: Baseline must fail the intended service and HTTP assertions
        if: matrix.mode == 'red'
        run: |
          set -euo pipefail
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^(TestOpenAIConnectionManagementRejectsAPIKey|TestOpenAIConnectionCreationRejectsMixedCredentials)$/(list|api_key)$' -count=1 -json -timeout=20m) > "$RUNNER_TEMP/connection-proof/service.jsonl" 2>&1
          service_result=$?
          (cd backend && go test -tags=unit ./internal/handler/admin -run '^TestOpenAIConnectionHandlerAccountType$/(apikey|oauth)/(list|reject_mixed)$' -count=1 -json -timeout=20m) > "$RUNNER_TEMP/connection-proof/handler.jsonl" 2>&1
          handler_result=$?
          set -e
          cat "$RUNNER_TEMP/connection-proof/service.jsonl"
          cat "$RUNNER_TEMP/connection-proof/handler.jsonl"
          test "$service_result" -ne 0
          test "$handler_result" -ne 0
          python3 .github/scripts/openai-connection-account-type-proof.py backend-red "$RUNNER_TEMP/connection-proof"
      - name: Current head service handler and production repository adapter must compile and pass
        if: matrix.mode == 'green'
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/service ./internal/handler/admin -run '^TestOpenAIConnection|^TestIssue594' -count=1 -json -timeout=20m) > "$RUNNER_TEMP/connection-proof/backend.jsonl" 2>&1 || { cat "$RUNNER_TEMP/connection-proof/backend.jsonl"; exit 1; }
          cat "$RUNNER_TEMP/connection-proof/backend.jsonl"
          python3 .github/scripts/openai-connection-account-type-proof.py backend-green "$RUNNER_TEMP/connection-proof"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connection-type-backend-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/connection-proof
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [red, green]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE: cf3d30c69ea997d15a5d714805d5b6ad2901463f
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Real Vue child and editor mounts with actual Axios adapter
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD
          mkdir -p "$RUNNER_TEMP/connection-proof"
          if [ "$MODE" = red ]; then
            git restore --source="$BASELINE" --worktree -- \
              frontend/src/components/account/OpenAIAuthConnections.vue \
              frontend/src/components/account/EditAccountModal.vue \
              frontend/src/api/admin/openaiAuthConnections.ts
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/connection-proof/head.txt"
          git diff --name-only | tee "$RUNNER_TEMP/connection-proof/restored-paths.txt"
          git diff --exit-code HEAD -- '*spec.ts'
          set +e
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/OpenAIAuthConnections.spec.ts \
            src/components/account/__tests__/EditAccountModal.spec.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/connection-proof/ui.json" > "$RUNNER_TEMP/connection-proof/ui.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/connection-proof/ui.log"
          if [ "$MODE" = red ]; then
            test "$result" -ne 0
          else
            test "$result" -eq 0
            pnpm --dir frontend run typecheck
            git diff --exit-code HEAD
          fi
          python3 .github/scripts/openai-connection-account-type-proof.py "ui-$MODE" "$RUNNER_TEMP/connection-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connection-type-ui-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/connection-proof
          if-no-files-found: error

  persisted-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Existing PostgreSQL Redis HTTP inference and OAuth compatibility regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/connection-proof"
          (cd backend && go test -tags=integration ./internal/repository ./internal/service -run '^TestIssue594|^TestOpenAIConnection' -count=1 -json -timeout=25m) > "$RUNNER_TEMP/connection-proof/integration.jsonl" 2>&1 || { cat "$RUNNER_TEMP/connection-proof/integration.jsonl"; exit 1; }
          cat "$RUNNER_TEMP/connection-proof/integration.jsonl"
          python3 .github/scripts/openai-connection-account-type-proof.py integration-green "$RUNNER_TEMP/connection-proof"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connection-type-persisted-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/connection-proof
          if-no-files-found: error
