name: PR899 platform credential acceptance

on:
  pull_request:
    paths:
      - 'backend/internal/service/**'
      - 'frontend/src/components/account/**'
      - '.github/scripts/pr899-*'
      - '.github/scripts/test_pr899_assert_oracle.py'
      - '.github/workflows/pr899-platform-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr899-platform-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend-same-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check oracle gate rejects incomplete or contaminated logs
        run: python3 -m unittest discover -s .github/scripts -p test_pr899_assert_oracle.py -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Frozen production RED and candidate GREEN with identical oracle blobs
        run: bash .github/scripts/pr899-platform-credentials.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr899-backend-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/pr899-backend
          if-no-files-found: error

  frontend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Original 178 assertions
        run: pnpm --dir frontend exec vitest run src/components/account/__tests__/EditAccountModal.spec.ts
      - name: Unchanged independent oracles
        run: pnpm --dir frontend exec vitest run src/components/account/__tests__/PR899Independent.spec.ts -t 'PR899 oracle'
      - name: Complete frontend suite
        run: pnpm --dir frontend test:run --maxWorkers=2 --minWorkers=1
      - name: Production build
        run: pnpm --dir frontend build
