name: Multi-host Caddy contract

on:
  push:
    branches: [production]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# PR updates replace older runs; other events keep a separate group per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      real-proxy-responses: ${{ steps.select.outputs['real-proxy-responses'] }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install selector dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Select affected checks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/select_jobs.py multihost-caddy.yml

  real-proxy-responses:
    needs: changes
    if: needs.changes.outputs['real-proxy-responses'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch verified Caddy 2.11.7 binary
        shell: bash
        run: |
          set -euo pipefail
          proxy_fixture_dir="$RUNNER_TEMP/sub2api-caddy-contract"
          mkdir -p "$proxy_fixture_dir"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 120 \
            --connect-timeout 10 --max-time 90 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$proxy_fixture_dir/caddy.tar.gz"
          echo '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  '"$proxy_fixture_dir/caddy.tar.gz" | sha256sum --check --strict
          tar -xzf "$proxy_fixture_dir/caddy.tar.gz" -C "$proxy_fixture_dir" caddy
          echo "CADDY_BIN=$proxy_fixture_dir/caddy" >> "$GITHUB_ENV"
      - name: Real proxy and two synthetic HTTP SSE origins
        run: python3 deploy/traffic/test_caddy_responses.py
      - name: Verified HTTPS origins with synthetic CA and SNI failures
        run: python3 deploy/traffic/test_caddy_responses_tls.py
