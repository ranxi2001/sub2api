name: PR838 compatibility response counter
on:
  push:
    branches: [maintenance/pr838-compat-count-fix-20261114]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr838-compat-count-${{ github.ref }}
  cancel-in-progress: true
jobs:
  counter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Original PR head must fail the retained compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr838-counter"
          git rev-parse HEAD > "$RUNNER_TEMP/pr838-counter/head.txt"
          baseline=d2b2b246fc0235740e87c742b24be5a5c9e055e0
          targets=(backend/internal/service/openai_gateway_cc_pipeline.go backend/internal/service/openai_gateway_upstream_errors.go)
          trap 'git restore --source=HEAD -- "${targets[@]}"' EXIT
          for target in "${targets[@]}"; do
            git show "$baseline:$target" > "$target"
            test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
          done
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^TestCompatErrorPipelineCountsEachResponseOnce$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/pr838-counter/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr838-counter/red.log"
          test "$result" -eq 1
          ! grep -Eiq 'build failed|undefined:|no tests to run|panic:|--- SKIP:' "$RUNNER_TEMP/pr838-counter/red.log"
          grep -q 'same upstream response must be counted once across compatibility handlers' "$RUNNER_TEMP/pr838-counter/red.log"
          git restore --source=HEAD -- "${targets[@]}"
          trap - EXIT
          git diff --exit-code
      - name: Fixed compatibility pipeline and existing authentication controls
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -tags=unit ./internal/service -run '^Test(CompatErrorPipeline|FastPathThenGeneralHandler|PendingModel401|Credential401|OpenAIWSAfterOutput)' -count=1 -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/pr838-counter/green.log"
          grep -q -- '--- PASS: TestCompatErrorPipelineCountsEachResponseOnce' "$RUNNER_TEMP/pr838-counter/green.log"
          ! grep -Eiq 'build failed|undefined:|no tests to run|panic:|--- SKIP:|DATA RACE' "$RUNNER_TEMP/pr838-counter/green.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr838-compat-counter-${{ github.sha }}
          path: ${{ runner.temp }}/pr838-counter/
