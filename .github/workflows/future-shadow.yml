name: Future readable shadow TDD

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [RED, GREEN, BOTH]
        default: RED
        description: Test-first RED; enable BOTH with the shadow production implementation
  pull_request:
    paths:
      - 'backend/internal/handler/openai_409_shadow*'
      - 'backend/internal/service/openai_agent_message_*'
      - 'backend/internal/service/openai_409_*'
      - 'backend/internal/repository/gateway_cache_agent*'
      - '.github/scripts/assert-future-shadow.py'
      - '.github/scripts/test_assert_future_shadow.py'
      - '.github/workflows/future-shadow.yml'
permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Evidence self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p 'test_assert_future_shadow.py' -v 2>&1 | tee "$RUNNER_TEMP/shadow-validator.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shadow-validator-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shadow-validator.log
          if-no-files-found: error
  http:
    name: Future shadow HTTP ${{ matrix.phase }}
    needs: validator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.phase == 'BOTH' && '["RED","GREEN"]' || inputs.phase == 'GREEN' && '["GREEN"]' || '["RED"]') }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: 84e47f1b57acba77f1cfae08a63e8dd9d32a7991
      PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install isolated Redis
        run: |
          bash .github/scripts/ci-ubuntu-mirrors.sh
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - name: Freeze candidate tests and disposable baseline source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/shadow-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/shadow-evidence/candidate.txt"
          git rev-parse "$BASELINE_SHA" > "$RUNNER_TEMP/shadow-evidence/baseline.txt"
          if [ "$PHASE" = RED ]; then
            git worktree add --detach "$RUNNER_TEMP/shadow-red" "$CANDIDATE_SHA"
            cd "$RUNNER_TEMP/shadow-red"
            while IFS= read -r target; do
              case "$target" in *_test.go) continue ;; esac
              if git cat-file -e "$BASELINE_SHA:$target" 2>/dev/null; then
                git show "$BASELINE_SHA:$target" > "$target"
                test "$(git hash-object "$target")" = "$(git rev-parse "$BASELINE_SHA:$target")"
              else
                rm -- "$target"
              fi
            done < <(git diff --no-renames --name-only "$BASELINE_SHA" "$CANDIDATE_SHA" -- 'backend/**/*.go')
            git diff --exit-code "$BASELINE_SHA" -- 'backend/**/*.go' ':!backend/**/*_test.go'
          fi
          git diff --exit-code "$CANDIDATE_SHA" -- 'backend/**/*_test.go'
          for target in backend/internal/handler/openai_409_shadow_http_test.go backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_409_omit_history.go; do
            git hash-object "$target" >> "$RUNNER_TEMP/shadow-evidence/blobs.txt"
          done
      - name: Actual cross-node HTTP continuation
        shell: bash
        run: |
          set -euo pipefail
          tested_tree="$GITHUB_WORKSPACE"
          if [ "$PHASE" = RED ]; then tested_tree="$RUNNER_TEMP/shadow-red"; fi
          set +e
          (cd "$tested_tree/backend" && go test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409FutureShadowHTTP$' -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-evidence/transport.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/shadow-evidence/transport.jsonl"
          python3 .github/scripts/assert-future-shadow.py "$PHASE" "$result" "$RUNNER_TEMP/shadow-evidence/transport.jsonl"
      - name: GREEN scope and delivery boundaries
        if: matrix.phase == 'GREEN'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd backend && go test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409FutureShadowBoundaries$' -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl"
          python3 .github/scripts/assert-future-shadow.py GREEN "$result" "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl" --boundaries
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: future-shadow-${{ matrix.phase }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/shadow-evidence/
          if-no-files-found: error
