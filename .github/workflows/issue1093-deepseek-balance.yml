name: Issue1093 DeepSeek balance regression and rendered evidence

on:
  pull_request:
    branches: [production]
    paths:
      - 'frontend/src/components/account/**'
      - 'frontend/src/i18n/**'
      - 'frontend/src/style.css'
      - 'frontend/tailwind.config.js'
      - 'frontend/postcss.config.js'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/vitest.config.ts'
      - '.github/scripts/issue1093-*'
      - '.github/workflows/issue1093-deepseek-balance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue1093-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  NODE_OPTIONS: --max-old-space-size=6144
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASELINE_SHA: 76a2e0f308219781833f560e5b642368cd106ad8

jobs:
  real-component-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Freeze exact source and install locked dependencies remotely
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue1093-tests"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/issue1093-tests/candidate-sha.txt"
          node --version > "$RUNNER_TEMP/issue1093-tests/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/issue1093-tests/toolchain.txt"
          pnpm --dir frontend install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/issue1093-tests/install.log"
      - name: Prepare unmodified defect baseline with only the same new test oracle
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/issue1093-test-before"
          mkdir -p "$OLD"
          git archive "$BASELINE_SHA" | tar -x -C "$OLD"
          cmp frontend/package.json "$OLD/frontend/package.json"
          cmp frontend/pnpm-lock.yaml "$OLD/frontend/pnpm-lock.yaml"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$OLD/frontend/node_modules"
          TEST_FILE=src/components/account/__tests__/AccountUsageCell.deepseekBalance.spec.ts
          cp "frontend/$TEST_FILE" "$OLD/frontend/$TEST_FILE"
          cmp "frontend/$TEST_FILE" "$OLD/frontend/$TEST_FILE"
          sha256sum "frontend/$TEST_FILE" "$OLD/frontend/$TEST_FILE" > "$RUNNER_TEMP/issue1093-tests/oracle-sha256.txt"
          printf '%s\n' "$BASELINE_SHA" > "$RUNNER_TEMP/issue1093-tests/baseline-sha.txt"
      - name: Baseline must fail the named missing-balance behavior
        run: |
          set -euo pipefail
          set +e
          pnpm --dir "$RUNNER_TEMP/issue1093-test-before/frontend" exec vitest run \
            src/components/account/__tests__/AccountUsageCell.deepseekBalance.spec.ts \
            -t 'ISSUE1093 restores official balance alongside generic local usage' \
            --reporter=json --outputFile="$RUNNER_TEMP/issue1093-tests/red.json" \
            > "$RUNNER_TEMP/issue1093-tests/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue1093-tests/red.log"
          python3 - "$status" "$RUNNER_TEMP/issue1093-tests/red.json" <<'PY'
          import json,sys
          assert int(sys.argv[1]) == 1, 'Baseline must fail, not crash or pass'
          report=json.load(open(sys.argv[2]))
          cases=[case for suite in report['testResults'] for case in suite['assertionResults']]
          named=[case for case in cases if 'ISSUE1093 restores official balance alongside generic local usage' in case['fullName']]
          assert len(named)==1 and named[0]['status']=='failed', 'No named behavioral RED'
          assert report['numFailedTests']==1 and report['numPassedTests']==0
          assert any('ISSUE1093_OFFICIAL_BALANCE_MISSING' in message for message in named[0]['failureMessages']), 'Setup/import failure is not RED'
          PY
      - name: Candidate real-component and existing account regressions
        run: |
          set -euo pipefail
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/AccountUsageCell.deepseekBalance.spec.ts \
            src/components/account/__tests__/AccountUsageCell.spec.ts \
            src/components/account/__tests__/CNProviderBalanceCell.spec.ts \
            src/components/account/__tests__/credentialsBuilder.spec.ts \
            src/components/account/__tests__/credentialsBuilder.cnAdaptive.spec.ts \
            src/components/account/__tests__/credentialsBuilder.platformCatalog.spec.ts \
            src/i18n/__tests__/localeKeyCompleteness.spec.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/issue1093-tests/green.json" \
            2>&1 | tee "$RUNNER_TEMP/issue1093-tests/green.log"
          python3 - "$RUNNER_TEMP/issue1093-tests/green.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['success'] and report['numFailedTests']==0
          suites=[suite for suite in report['testResults'] if suite['name'].endswith('AccountUsageCell.deepseekBalance.spec.ts')]
          assert len(suites)==1 and len(suites[0]['assertionResults'])>=25
          assert all(case['status']=='passed' for case in suites[0]['assertionResults']), 'No skipped acceptance cases'
          PY
      - name: Read-only frontend lint, typecheck and production build
        run: |
          set -euo pipefail
          pnpm --dir frontend run lint:check 2>&1 | tee "$RUNNER_TEMP/issue1093-tests/lint.log"
          pnpm --dir frontend run typecheck 2>&1 | tee "$RUNNER_TEMP/issue1093-tests/typecheck.log"
          pnpm --dir frontend run build 2>&1 | tee "$RUNNER_TEMP/issue1093-tests/build.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue1093-tests-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue1093-tests
          if-no-files-found: error

  rendered-before-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked remote toolchain
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/issue1093-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/issue1093-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo timeout 180s apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 -o APT::Update::Error-Mode=any \
            -o Acquire::AllowInsecureRepositories=false -o APT::Get::AllowUnauthenticated=false \
            install -y --no-install-recommends fonts-noto-cjk
      - name: Actual archived component rendering, CSS and explicit Query interaction
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/issue1093-browser/node_modules/playwright
          EVIDENCE_DIR: ${{ runner.temp }}/issue1093-rendered
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node --version > "$EVIDENCE_DIR/toolchain.txt"
          pnpm --version >> "$EVIDENCE_DIR/toolchain.txt"
          node .github/scripts/issue1093-ui-evidence.mjs 2>&1 | tee "$EVIDENCE_DIR/render.log"
          test -s "$EVIDENCE_DIR/manifest.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue1093-rendered-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue1093-rendered
          if-no-files-found: error
