name: Maintenance UI evidence for PR771 and PR772

on:
  push:
    branches: [evidence/maintenance-ui-760-763-20261110]

permissions:
  contents: read

concurrency:
  group: maintenance-ui-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert evidence head and archive exact sources
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE_SUITE=771-772
          export EVIDENCE_RUNTIME="$RUNNER_TEMP/maintenance-ui-771-772-runtime"
          export EVIDENCE_OUTPUT="$RUNNER_TEMP/maintenance-ui-771-772-evidence"
          export PLAYWRIGHT_ROOT="$EVIDENCE_RUNTIME/browser/node_modules/playwright"
          printf '%s\n' "EVIDENCE_SUITE=$EVIDENCE_SUITE" "EVIDENCE_RUNTIME=$EVIDENCE_RUNTIME" "EVIDENCE_OUTPUT=$EVIDENCE_OUTPUT" "PLAYWRIGHT_ROOT=$PLAYWRIGHT_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_OUTPUT" "$EVIDENCE_RUNTIME/sources" "$EVIDENCE_RUNTIME/dependencies"
          test "$GITHUB_REF" = refs/heads/evidence/maintenance-ui-760-763-20261110
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -z "$(git status --porcelain)"
          base=e295f336ffd681ca5ccb3e85b27e9ae7d247bf46
          pr771=ffdbf5c68f8407b2ea5cfe1865eba2596b845a03
          pr772=689621b969a6f718a59fed515acd69de72200428
          git -c credential.helper= fetch --no-tags https://github.com/ranxi2001/sub2api.git "$base" "$pr771" "$pr772"
          test "$(git merge-base "$pr771" "$pr772")" = "$base"
          test "$(git rev-parse "$base:frontend/src/components/admin/operations/OAuthDegradationCard.vue")" = af373c32aa279e4b130f140ad4b3259c11a55277
          test "$(git rev-parse "$pr771:frontend/src/components/admin/operations/OAuthDegradationCard.vue")" = af373c32aa279e4b130f140ad4b3259c11a55277
          test "$(git rev-parse "$base:frontend/src/i18n/locales/zh/autoConfig.ts")" = c8f60211fd6fa52dae696282e8d157199ad30d7e
          test "$(git rev-parse "$pr771:frontend/src/i18n/locales/zh/autoConfig.ts")" = ab0dc7582047930d3c943d2fec4bd87dc09c2947
          test "$(git rev-parse "$base:frontend/src/i18n/locales/en/autoConfig.ts")" = 73ed75bd7a1813b72a67e5954a05c25e3337e6e6
          test "$(git rev-parse "$pr771:frontend/src/i18n/locales/en/autoConfig.ts")" = c7ab84f53c12a23a4c54a2323d02c6ff595202cd
          test "$(git rev-parse "$base:frontend/src/views/admin/AccountQualityView.vue")" = 6ef2c412dd9788e5f01e599a7d99d04455107de9
          test "$(git rev-parse "$pr772:frontend/src/views/admin/AccountQualityView.vue")" = dee4c579524ac0a4ceaa49b567839ec141391f1f
          for label in base pr771 pr772; do
            sha="${!label}"
            test "$(git rev-parse "$sha^{commit}")" = "$sha"
            mkdir "$EVIDENCE_RUNTIME/sources/$label"
            git archive --format=tar "$sha" | tar -xf - -C "$EVIDENCE_RUNTIME/sources/$label"
            for file in package.json pnpm-lock.yaml .npmrc; do
              cmp "$EVIDENCE_RUNTIME/sources/base/frontend/$file" "$EVIDENCE_RUNTIME/sources/$label/frontend/$file"
            done
            printf '%s %s\n' "$label" "$sha" >> "$EVIDENCE_OUTPUT/archive-commits.txt"
          done
          cp "$EVIDENCE_RUNTIME/sources/base/frontend/"{package.json,pnpm-lock.yaml,.npmrc} "$EVIDENCE_RUNTIME/dependencies/"
          chmod -R a-w "$EVIDENCE_RUNTIME/sources"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Frozen frontend dependencies outside immutable sources
        run: |
          set -euo pipefail
          pnpm --dir "$EVIDENCE_RUNTIME/dependencies" install --frozen-lockfile
          ln -s "$EVIDENCE_RUNTIME/dependencies/node_modules" "$EVIDENCE_RUNTIME/node_modules"
      - name: Isolated Chromium and Chinese fonts
        run: |
          set -euo pipefail
          npm install --prefix "$EVIDENCE_RUNTIME/browser" --no-save --ignore-scripts playwright@1.56.1
          "$EVIDENCE_RUNTIME/browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
      - name: Real components, CSS gates, before and after, interactions
        run: node .github/scripts/maintenance-ui-evidence.mjs
      - name: Evidence checkout remains unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maintenance-ui-771-772-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-ui-771-772-evidence
          if-no-files-found: error
          retention-days: 14
