name: Issue614 lifecycle synthetic regression
on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/**'
      - 'frontend/src/components/admin/PriorityLifecyclePanel.vue'
      - 'frontend/src/components/admin/__tests__/PriorityLifecyclePanel.spec.ts'
      - 'frontend/src/views/admin/PrioritySchedulingView.vue'
      - 'frontend/src/api/admin/priorityScheduling.ts'
      - 'frontend/src/i18n/locales/*/priorityScheduling.ts'
      - '.github/scripts/issue614-lifecycle-browser.mjs'
      - '.github/workflows/issue614-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: issue614-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  handler-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated real-admin browser
        run: |
          npm install --prefix "$RUNNER_TEMP/issue614-real-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/issue614-real-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual handler transport usage repository policy state chain
        env:
          ISSUE614_REAL_BROWSER: '1'
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/issue614-real-browser/node_modules/playwright
          ISSUE614_BROWSER_DIR: ${{ runner.temp }}/issue614-chain/browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue614-chain"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          (cd backend && go test -tags=unit,integration ./internal/handler -run '^TestPriorityLifecycleRealHandlerUsagePolicyAndState$' -count=1 -v -timeout=25m) > "$RUNNER_TEMP/issue614-chain/chain.log" 2>&1 || { cat "$RUNNER_TEMP/issue614-chain/chain.log"; exit 1; }
          cat "$RUNNER_TEMP/issue614-chain/chain.log"
          grep -q -- '--- PASS: TestPriorityLifecycleRealHandlerUsagePolicyAndState' "$RUNNER_TEMP/issue614-chain/chain.log"
          grep -q 'REAL_ADMIN_BROWSER_PASS' "$RUNNER_TEMP/issue614-chain/chain.log"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue614-chain-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue614-chain
  lifecycle-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Actual components and production typecheck build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          pnpm --dir frontend exec vitest run src/components/admin/__tests__/PriorityLifecyclePanel.spec.ts src/views/admin/__tests__/PrioritySchedulingView.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1
          pnpm --dir frontend run typecheck
          pnpm --dir frontend run build
      - name: Isolated synthetic browser
        run: |
          npm install --prefix "$RUNNER_TEMP/issue614-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/issue614-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chinese English desktop mobile browser evidence
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/issue614-browser/node_modules/playwright
          ISSUE614_BROWSER_DIR: ${{ runner.temp }}/issue614-browser-evidence
        run: node .github/scripts/issue614-lifecycle-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue614-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue614-browser-evidence
  durable-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real PostgreSQL outbox and independent durable evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue614-durable"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          (cd backend && go test -tags=integration ./internal/repository -run '^TestPriorityLifecycle' -count=1 -v -timeout=25m) > "$RUNNER_TEMP/issue614-durable/integration.log" 2>&1 || { cat "$RUNNER_TEMP/issue614-durable/integration.log"; exit 1; }
          cat "$RUNNER_TEMP/issue614-durable/integration.log"
          grep -q -- '--- PASS: TestPriorityLifecycleDurableOutboxScopeAndDeadline' "$RUNNER_TEMP/issue614-durable/integration.log"
          ! grep -q -- '--- SKIP: TestPriorityLifecycle' "$RUNNER_TEMP/issue614-durable/integration.log"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue614-durable-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue614-durable
          if-no-files-found: error
  physical-write:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASELINE: d14ed1807bdfe43aabed1739c0e062c1f4512ddf
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: RED old production must fail the physical generation boundary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue614-proof"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/issue614-proof/head.txt"
          git worktree add --detach "$RUNNER_TEMP/issue614-red" "$BASELINE"
          cp backend/internal/service/priority_lifecycle_prewrite_test.go "$RUNNER_TEMP/issue614-red/backend/internal/service/"
          set +e
          (cd "$RUNNER_TEMP/issue614-red/backend" && go test -tags=unit ./internal/service -run '^TestPriorityLifecycle(PassthroughPhysicalWriteFence|AdminGETReadOnly|PolicyOnlyChangeRetainsStatistics)$' -count=1 -v -timeout=12m) > "$RUNNER_TEMP/issue614-proof/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue614-proof/red.log"
          test "$result" -ne 0
          grep -q 'LIFECYCLE_PREWRITE: stopped follow-up generation reached physical upstream write' "$RUNNER_TEMP/issue614-proof/red.log"
          grep -q -- '--- FAIL: TestPriorityLifecyclePassthroughPhysicalWriteFence' "$RUNNER_TEMP/issue614-proof/red.log"
          grep -q 'LIFECYCLE_GET: management read launched or mutated routing history' "$RUNNER_TEMP/issue614-proof/red.log"
          grep -q -- '--- FAIL: TestPriorityLifecycleAdminGETReadOnly' "$RUNNER_TEMP/issue614-proof/red.log"
          grep -q 'LIFECYCLE_STATISTICS: policy-only change discarded the measured population' "$RUNNER_TEMP/issue614-proof/red.log"
          ! grep -Eq 'undefined:|build failed|no tests to run|fixture must publish' "$RUNNER_TEMP/issue614-proof/red.log"
      - name: GREEN exact head production adapters handlers and physical writes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          (cd backend && go test -tags=unit ./internal/service ./internal/handler ./internal/repository ./internal/service/openai_ws_v2 -run '^TestPriorityLifecycle|^TestPriorityLatency|^TestRelay|^TestOpenAITurnAdmission' -count=1 -v -timeout=15m) > "$RUNNER_TEMP/issue614-proof/green.log" 2>&1 || { cat "$RUNNER_TEMP/issue614-proof/green.log"; exit 1; }
          cat "$RUNNER_TEMP/issue614-proof/green.log"
          grep -q -- '--- PASS: TestPriorityLifecyclePassthroughPhysicalWriteFence' "$RUNNER_TEMP/issue614-proof/green.log"
          (cd backend && go build ./internal/service ./internal/repository ./internal/handler/... ./internal/server/... ./cmd/server)
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue614-physical-write-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue614-proof
          if-no-files-found: error
