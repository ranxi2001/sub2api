name: WS HTTP bridge non-generating warmup
on:
  pull_request:
    paths:
      - 'backend/internal/service/openai_ws_http*'
      - 'backend/internal/service/openai_ws_accepted_tool_history*'
      - 'backend/internal/service/openai_ws_agent_recovery.go'
      - 'backend/internal/service/openai_ws_forwarder_ingress.go'
      - 'backend/internal/service/openai_gateway_service.go'
      - 'backend/internal/handler/openai_gateway_handler.go'
      - 'backend/internal/handler/openai_http_bridge_warmup_test.go'
      - '.github/workflows/ws-http-bridge-warmup.yml'
permissions:
  contents: read
concurrency:
  group: ws-http-warmup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Released baseline sends a non-generating warmup upstream
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/http-warmup-base" 4ba33f8713cbf6c6406e0f2639ffcc2ef1e31c87
          cp backend/internal/handler/openai_http_bridge_warmup_test.go "$RUNNER_TEMP/http-warmup-base/backend/internal/handler/"
          set +e
          (cd "$RUNNER_TEMP/http-warmup-base/backend" && go test -json -tags=unit,bridgewarmup ./internal/handler -run '^TestHTTPBridgeWarmupThenToolContinuation$' -count=1 -timeout=2m) > "$RUNNER_TEMP/http-warmup-base.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http-warmup-base.jsonl"
          python3 - "$result" "$RUNNER_TEMP/http-warmup-base.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[2]) if line.startswith('{')]
          name='TestHTTPBridgeWarmupThenToolContinuation'
          assert int(sys.argv[1])==1
          assert not any(r.get('Action') in ('build-fail','skip') for r in rows)
          assert any(r.get('Test')==name and r.get('Action')=='fail' for r in rows)
          assert 'HTTP_WARMUP_SENT_UPSTREAM' in ''.join(r.get('Output','') for r in rows if r.get('Test')==name)
          PY
      - name: Candidate warmup, full-history tool loop and refusal controls
        run: |
          set -euo pipefail
          (cd backend && go test -race -json -tags=unit,bridgewarmup ./internal/handler ./internal/service -run '^Test(HTTPBridgeWarmup|HTTPBridgeAcceptedHistory|OpenAIWSHTTPBridgeAPIKeyReusesClientToolMappingWhenFollowupOmitsTools|PrepareOpenAIWSHTTPBridgeBody)' -count=1 -timeout=3m) | tee "$RUNNER_TEMP/http-warmup-head.jsonl"
          python3 - "$RUNNER_TEMP/http-warmup-head.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          assert not any(r.get('Action') in ('build-fail','fail','skip') for r in rows)
          for name in ('TestHTTPBridgeWarmupThenToolContinuation','TestHTTPBridgeWarmupGuards','TestHTTPBridgeWarmupDefaultsAndForeignPointer','TestHTTPBridgeWarmupWithPriorCompletedToolHistory','TestHTTPBridgeAcceptedHistoryRequiresCompletedDelivery'):
              assert any(r.get('Test')==name and r.get('Action')=='pass' for r in rows),name
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http-warmup-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/http-warmup-*.jsonl
          if-no-files-found: error
