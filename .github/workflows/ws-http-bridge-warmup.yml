name: WS HTTP bridge non-generating warmup
on:
  pull_request:
    paths:
      - 'backend/internal/service/openai_ws_http*'
      - 'backend/internal/service/openai_ws_accepted_tool_history*'
      - 'backend/internal/service/openai_ws_agent_recovery.go'
      - 'backend/internal/service/openai_ws_forwarder_ingress.go'
      - 'backend/internal/service/openai_gateway_service.go'
      - 'backend/internal/handler/openai_gateway_handler.go'
      - 'backend/internal/handler/openai_http_bridge_warmup_test.go'
      - 'backend/internal/handler/openai_ws_tool_result_bridge_test.go'
      - 'backend/internal/handler/openai_ws_http_bridge_history_test.go'
      - '.github/scripts/assert-issue999-history.py'
      - '.github/workflows/ws-http-bridge-warmup.yml'
permissions:
  contents: read
concurrency:
  group: ws-http-warmup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assistant-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Preserve regressions on pinned old production in disposable checkout
        run: |
          set -euo pipefail
          baseline=8dedf05db37c870265e04327defb9e96e7787603
          old="$RUNNER_TEMP/issue999-old"
          git worktree add --detach "$old" "$baseline"
          cp backend/internal/handler/openai_ws_http_bridge_history_test.go "$old/backend/internal/handler/"
          {
            git rev-parse HEAD
            git -C "$old" rev-parse HEAD
            git rev-parse HEAD:backend/internal/service/openai_ws_http_bridge.go
            git -C "$old" rev-parse HEAD:backend/internal/service/openai_ws_http_bridge.go
            sha256sum backend/internal/handler/openai_ws_http_bridge_history_test.go "$old/backend/internal/handler/openai_ws_http_bridge_history_test.go"
          } > "$RUNNER_TEMP/issue999-identities.txt"
          cmp backend/internal/handler/openai_ws_http_bridge_history_test.go "$old/backend/internal/handler/openai_ws_http_bridge_history_test.go"
          git -C "$old" diff --exit-code -- backend/internal/service
          set +e
          (cd "$old/backend" && go test -race -json -tags=unit,bridgewarmup ./internal/handler -run '^TestIssue999HTTPBridgeAssistantHistory$' -count=1 -timeout=8m) > "$RUNNER_TEMP/issue999-red.jsonl" 2>&1
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/issue999-red.exit"
          cat "$RUNNER_TEMP/issue999-red.jsonl"
          python3 .github/scripts/assert-issue999-history.py RED "$result" "$RUNNER_TEMP/issue999-red.jsonl"
      - name: Candidate complete ordered history and delivery controls
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          set +e
          (cd backend && go test -race -json -tags=unit,bridgewarmup ./internal/handler ./internal/service -run '^TestIssue999HTTPBridge' -count=1 -timeout=8m) > "$RUNNER_TEMP/issue999-green.jsonl" 2>&1
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/issue999-green.exit"
          cat "$RUNNER_TEMP/issue999-green.jsonl"
          python3 .github/scripts/assert-issue999-history.py GREEN "$result" "$RUNNER_TEMP/issue999-green.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue999-assistant-history-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/issue999-*.jsonl
            ${{ runner.temp }}/issue999-*.exit
            ${{ runner.temp }}/issue999-identities.txt
          if-no-files-found: error
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Released baseline sends a non-generating warmup upstream
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/http-warmup-base" 4ba33f8713cbf6c6406e0f2639ffcc2ef1e31c87
          cp backend/internal/handler/openai_http_bridge_warmup_test.go "$RUNNER_TEMP/http-warmup-base/backend/internal/handler/"
          set +e
          (cd "$RUNNER_TEMP/http-warmup-base/backend" && go test -json -tags=unit,bridgewarmup ./internal/handler -run '^TestHTTPBridgeWarmupThenToolContinuation$' -count=1 -timeout=2m) > "$RUNNER_TEMP/http-warmup-base.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http-warmup-base.jsonl"
          python3 - "$result" "$RUNNER_TEMP/http-warmup-base.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[2]) if line.startswith('{')]
          name='TestHTTPBridgeWarmupThenToolContinuation'
          assert int(sys.argv[1])==1
          assert not any(r.get('Action') in ('build-fail','skip') for r in rows)
          assert any(r.get('Test')==name and r.get('Action')=='fail' for r in rows)
          assert 'HTTP_WARMUP_SENT_UPSTREAM' in ''.join(r.get('Output','') for r in rows if r.get('Test')==name)
          PY
      - name: Candidate warmup, full-history tool loop and refusal controls
        run: |
          set -euo pipefail
          (cd backend && go test -race -json -tags=unit,bridgewarmup ./internal/handler ./internal/service -run '^Test(HTTPBridgeLargeHistoryToolResult|HTTPBridgeWarmup|HTTPBridgeAcceptedHistory|OpenAIWSHTTPBridgeAPIKeyReusesClientToolMappingWhenFollowupOmitsTools|PrepareOpenAIWSHTTPBridgeBody)' -count=1 -timeout=3m) | tee "$RUNNER_TEMP/http-warmup-head.jsonl"
          python3 - "$RUNNER_TEMP/http-warmup-head.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          assert not any(r.get('Action') in ('build-fail','fail','skip') for r in rows)
          for name in ('TestHTTPBridgeLargeHistoryToolResult/api_key_large','TestHTTPBridgeLargeHistoryToolResult/oauth_large','TestHTTPBridgeLargeHistoryToolResult/oauth_wrong_response','TestHTTPBridgeLargeHistoryToolResult/oauth_unobserved_call','TestHTTPBridgeLargeHistoryToolResult/oauth_old_call','TestHTTPBridgeWarmupThenToolContinuation','TestHTTPBridgeWarmupGuards','TestHTTPBridgeWarmupDefaultsAndForeignPointer','TestHTTPBridgeWarmupWithPriorCompletedToolHistory','TestHTTPBridgeAcceptedHistoryRequiresCompletedDelivery'):
              assert any(r.get('Test')==name and r.get('Action')=='pass' for r in rows),name
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http-warmup-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/http-warmup-*.jsonl
          if-no-files-found: error
