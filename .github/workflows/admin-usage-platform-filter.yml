name: Admin usage platform filter
on:
  push:
    branches: [feat/admin-usage-platform-filter]
permissions:
  contents: read
concurrency:
  group: admin-usage-platform-filter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Platform behavioral regression
        run: pnpm --dir frontend exec vitest run src/components/admin/usage/__tests__/UsageFilters.spec.ts
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Historical platform SQL regression (disposable PostgreSQL)
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -tags=integration ./internal/repository -run '^TestUsagePlatformHistoricalQuery$' -count=1 -v -timeout=15m | tee "$RUNNER_TEMP/platform-sql.log"
          ! grep -E -- '--- SKIP:|no tests to run' "$RUNNER_TEMP/platform-sql.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-sql-${{ github.sha }}
          path: ${{ runner.temp }}/platform-sql.log
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/platform-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/platform-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render fixed baseline before UI implementation
        env:
          PLATFORM_EXPECTED_HEAD: ${{ github.sha }}
          PLATFORM_EVIDENCE_DIR: ${{ runner.temp }}/platform-evidence
          PLATFORM_CAPTURE_PHASE: baseline
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/platform-browser/node_modules/playwright
        run: node .github/fixtures/admin-usage-platform-filter/browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-browser-${{ github.sha }}
          path: ${{ runner.temp }}/platform-evidence
