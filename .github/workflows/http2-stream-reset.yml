name: HTTP2 stream reset validation

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.head_ref == 'fix/http2-stream-error-clarity' || github.ref_name == 'fix/http2-stream-error-clarity' || github.head_ref == 'fix/http2-reset-review-followup-20261114' || github.ref_name == 'fix/http2-reset-review-followup-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: F3 behavioral RED on pinned merged production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/http2-evidence"
          defect=ea1f3a28d8d1839e92ac5e48c6e9d7aeb90b0fff
          red_tree="$RUNNER_TEMP/http2-successor-red"
          git worktree add --detach "$red_tree" "$defect"
          test_source=backend/internal/repository/http2_ai_ops_identity_integration_test.go
          git show "HEAD:$test_source" > "$red_tree/$test_source"
          test "$(git hash-object "$red_tree/$test_source")" = "$(git rev-parse "HEAD:$test_source")"
          git rev-parse HEAD HEAD^{tree} "$defect" "$defect^{tree}" "HEAD:$test_source" > "$RUNNER_TEMP/http2-evidence/f3-red-identity.txt"
          set +e
          (cd "$red_tree/backend" && go test -tags=integration ./internal/repository -run '^TestHTTP2AIOpsFailureIdentityScopedToAPIKey$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/http2-evidence/f3-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/f3-red.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/http2-evidence/f3-red-exit.txt"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/f3-red.log"; then exit 1; fi
          for scenario in shared_request unknown_model conflicting_completed_usage; do
            grep -q -- "--- FAIL: TestHTTP2AIOpsFailureIdentityScopedToAPIKey/$scenario" "$RUNNER_TEMP/http2-evidence/f3-red.log"
          done
          for diagnostic in 'F3 one success plus two different-key resets sharing X-Request-ID must be three samples' 'F3 an older different-key unknown-model failure must remain a cohort blocker' 'F3 both scoped failures must survive success exclusion'; do
            grep -q -- "$diagnostic" "$RUNNER_TEMP/http2-evidence/f3-red.log"
          done
          test -z "$(git status --porcelain)"
      - name: F4 and F5 behavioral RED on the same pinned production tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          defect=ea1f3a28d8d1839e92ac5e48c6e9d7aeb90b0fff
          red_tree="$RUNNER_TEMP/http2-successor-red"
          test "$(git -C "$red_tree" rev-parse HEAD)" = "$defect"
          for test_source in backend/internal/service/http2_peer_reset_followup_test.go backend/internal/handler/http2_cc_semantic_followup_test.go; do
            git show "HEAD:$test_source" > "$red_tree/$test_source"
            expected=$(git rev-parse "HEAD:$test_source")
            actual=$(git hash-object "$red_tree/$test_source")
            test "$actual" = "$expected"
            echo "candidate=$EXPECTED_HEAD_SHA defect=$defect test=$test_source expected=$expected actual=$actual" >> "$RUNNER_TEMP/http2-evidence/f45-red-identity.txt"
          done
          set +e
          (cd "$red_tree/backend" && go test -tags=unit ./internal/service ./internal/handler -run '^TestHTTP2CC(SemanticFailureBeforeReset|IncompleteSemanticEventStillResets|SemanticFailureOwnershipAndSLA)$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/http2-evidence/f4-red.log" 2>&1
          f4_result=$?
          (cd "$red_tree/backend" && go test -tags=unit ./internal/service -run '^TestHTTP2NativeRelay(RequiresCompleteTerminal|CompleteTerminalControls)$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/http2-evidence/f5-red.log" 2>&1
          f5_result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/f4-red.log" "$RUNNER_TEMP/http2-evidence/f5-red.log"
          printf '%s\n' "$f4_result" > "$RUNNER_TEMP/http2-evidence/f4-red-exit.txt"
          printf '%s\n' "$f5_result" > "$RUNNER_TEMP/http2-evidence/f5-red-exit.txt"
          test "$f4_result" -eq 1
          test "$f5_result" -eq 1
          for finding in f4 f5; do
            if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/$finding-red.log"; then exit 1; fi
          done
          for mode in responses messages; do
            grep -q -- "--- FAIL: TestHTTP2CCSemanticFailureBeforeReset/$mode/event_error" "$RUNNER_TEMP/http2-evidence/f4-red.log"
            grep -q -- "--- FAIL: TestHTTP2CCSemanticFailureOwnershipAndSLA/$mode" "$RUNNER_TEMP/http2-evidence/f4-red.log"
            grep -q -- "--- PASS: TestHTTP2CCIncompleteSemanticEventStillResets/$mode" "$RUNNER_TEMP/http2-evidence/f4-red.log"
            grep -q "F4 complete CC semantic error must survive a later HTTP2 reset: $mode/event_error" "$RUNNER_TEMP/http2-evidence/f4-red.log"
            grep -q "F4 complete CC context rejection must retain client ownership after reset: $mode" "$RUNNER_TEMP/http2-evidence/f4-red.log"
          done
          for fragment in event_only event_no_data truncated_data missing_boundary data_only_cut invalid_json wrong_data_type; do
            grep -q -- "--- FAIL: TestHTTP2NativeRelayRequiresCompleteTerminal/$fragment" "$RUNNER_TEMP/http2-evidence/f5-red.log"
            grep -q "F5 incomplete native message_stop must not swallow a later HTTP2 reset: $fragment" "$RUNNER_TEMP/http2-evidence/f5-red.log"
          done
          grep -q 'F5 incomplete native message_stop must not swallow a later HTTP2 reset' "$RUNNER_TEMP/http2-evidence/f5-red.log"
          grep -q -- '--- PASS: TestHTTP2NativeRelayCompleteTerminalControls/success' "$RUNNER_TEMP/http2-evidence/f5-red.log"
          grep -q -- '--- PASS: TestHTTP2NativeRelayCompleteTerminalControls/data_only_success' "$RUNNER_TEMP/http2-evidence/f5-red.log"
          test -z "$(git status --porcelain)"
      - name: F1 behavioral RED through the real AIOps evidence query
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/http2-evidence"
          target=backend/internal/repository/ai_ops.go
          baseline=3137257829f0cc48466911aa4a249dd03f3c088f
          restore_ai_ops() { git show "HEAD:$target" > "$target"; }
          trap restore_ai_ops EXIT
          git show "$baseline:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
          git rev-parse HEAD "$baseline:$target" > "$RUNNER_TEMP/http2-evidence/f1-red-identity.txt"
          set +e
          (cd backend && go test -tags=integration ./internal/repository -run '^TestHTTP2AIOpsEvidenceIncludesCommittedTransportFailure$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/http2-evidence/f1-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/f1-red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/f1-red.log"; then exit 1; fi
          grep -q -- '--- FAIL: TestHTTP2AIOpsEvidenceIncludesCommittedTransportFailure' "$RUNNER_TEMP/http2-evidence/f1-red.log"
          grep -q 'AIOps must count one success plus the committed HTTP200 transport failure' "$RUNNER_TEMP/http2-evidence/f1-red.log"
          restore_ai_ops
          trap - EXIT
          git diff --exit-code
      - name: RED real HTTP2 boundary against production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/http2-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/http2-evidence/head.txt"
          baseline=ccf997c73868083d96c0bec56e71c1a34d26c98a
          # Keep the historical source/test dependencies on the last fully
          # validated pre-integration checkpoint. Copy the exact current HTTP2
          # regressions into this disposable tree; GREEN below runs full HEAD.
          reviewed=f177caec5510f502270ff3ceb36fe43295f405f1
          candidate=$(git rev-parse HEAD)
          red_tree="$RUNNER_TEMP/http2-historical-red"
          git worktree add --detach "$red_tree" "$reviewed"
          while IFS= read -r test_source; do
            git show "$candidate:$test_source" > "$red_tree/$test_source"
            expected=$(git rev-parse "$candidate:$test_source")
            actual=$(git hash-object "$red_tree/$test_source")
            test "$expected" = "$actual"
            echo "candidate_test=$test_source expected=$expected actual=$actual" >> "$RUNNER_TEMP/http2-evidence/red-tests.txt"
          # Postmerge F3/F4/F5 tests run unchanged on ea1f above and clean
          # candidate GREEN below. The older overlays remove TransportFailure;
          # keep their original regression set instead of compiling new tests
          # against a source contract predating that field.
          done < <(git ls-files 'backend/internal/handler/http2*_test.go' 'backend/internal/service/http2*_test.go' 'backend/internal/repository/http2*_test.go' ':!backend/internal/handler/http2_cc_semantic_followup_test.go' ':!backend/internal/service/http2_peer_reset_followup_test.go' ':!backend/internal/repository/http2_ai_ops_identity_integration_test.go')
          cd "$red_tree"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/http2-evidence/red-source-checkpoint.txt"
          mapfile -t targets < <(git diff --name-only "$baseline" "$reviewed" -- 'backend/**/*.go' ':!backend/**/*_test.go' ':!backend/**/*_test_support.go')
          restore_head() {
            for target in "${targets[@]}"; do git show "HEAD:$target" > "$target"; done
          }
          trap restore_head EXIT
          for target in "${targets[@]}"; do
            if git cat-file -e "$baseline:$target" 2>/dev/null; then
              git show "$baseline:$target" > "$target"
              test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
            fi
          done
          git diff --stat > "$RUNNER_TEMP/http2-evidence/overlay.txt"
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestHTTP2PeerResetBoundary$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/http2-evidence/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/red.log"; then exit 1; fi
          grep -q 'peer reset must persist as transport_error, not synthetic HTTP 502' "$RUNNER_TEMP/http2-evidence/red.log"
          grep -q -- '--- FAIL: TestHTTP2PeerResetBoundary' "$RUNNER_TEMP/http2-evidence/red.log"
          # New review findings must fail behaviorally against original production too.
          set +e
          (cd backend && go test -tags=unit ./internal/handler ./internal/service -run '^TestHTTP2PeerReset(BeforeHeaders|BufferedBoundaries|PartialImages|NativeConversionBoundary|NativeUsage|ImagesBeforeHeaders)$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/http2-evidence/review-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/review-red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/review-red.log"; then exit 1; fi
          for test_name in TestHTTP2PeerResetBeforeHeaders TestHTTP2PeerResetBufferedBoundaries TestHTTP2PeerResetPartialImages TestHTTP2PeerResetNativeConversionBoundary TestHTTP2PeerResetNativeUsage TestHTTP2PeerResetImagesBeforeHeaders; do
            grep -q -- "--- FAIL: $test_name" "$RUNNER_TEMP/http2-evidence/review-red.log"
          done
          for diagnostic in 'peer reset before headers must not replay a consumed POST' 'buffered reset must establish transport evidence' 'partial-image reset must persist a failed request' 'native reset must return failure instead of synthetic success' 'image reset before headers must persist transport_error'; do
            grep -q -- "$diagnostic" "$RUNNER_TEMP/http2-evidence/review-red.log"
          done
          # Semantic spoofing was introduced by the first patch; reproduce it
          # against the compiling pre-review candidate, retaining these tests.
          vulnerable=c351ebea9bf144c710780da5e4db0e264e6ebb9c
          for target in "${targets[@]}"; do git show "$vulnerable:$target" > "$target"; done
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^TestHTTP2SemanticImageErrorCannotSpoofReset$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/http2-evidence/spoof-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/spoof-red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/spoof-red.log"; then exit 1; fi
          grep -q -- '--- FAIL: TestHTTP2SemanticImageErrorCannotSpoofReset' "$RUNNER_TEMP/http2-evidence/spoof-red.log"
          grep -q 'semantic image text must not create trusted reset evidence' "$RUNNER_TEMP/http2-evidence/spoof-red.log"
          for target in "${targets[@]}"; do git show "a5bc18f34c68a4c870660b4449bbb73592c73d84:$target" > "$target"; done
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestHTTP2PeerResetWebSocketTurnPersistence$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/http2-evidence/ws-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/ws-red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/ws-red.log"; then exit 1; fi
          grep -q -- '--- FAIL: TestHTTP2PeerResetWebSocketTurnPersistence' "$RUNNER_TEMP/http2-evidence/ws-red.log"
          grep -q 'final transport marker must preserve both WebSocket turn failures' "$RUNNER_TEMP/http2-evidence/ws-red.log"
          for target in "${targets[@]}"; do git show "fe4aadbd9ecd0fdfa689282490fa2bf6736335a7:$target" > "$target"; done
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^TestHTTP2(NativeSemanticErrorBeforeReset|RawIncompleteErrorEventStillResets)$' -count=1 -v -timeout=3m) > "$RUNNER_TEMP/http2-evidence/terminal-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-evidence/terminal-red.log"
          test "$result" -eq 1
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/terminal-red.log"; then exit 1; fi
          grep -q -- '--- FAIL: TestHTTP2NativeSemanticErrorBeforeReset' "$RUNNER_TEMP/http2-evidence/terminal-red.log"
          grep -q -- '--- FAIL: TestHTTP2RawIncompleteErrorEventStillResets' "$RUNNER_TEMP/http2-evidence/terminal-red.log"
          grep -q 'native semantic failure must not become successful completion' "$RUNNER_TEMP/http2-evidence/terminal-red.log"
          grep -q 'incomplete raw error event must not suppress reset classification' "$RUNNER_TEMP/http2-evidence/terminal-red.log"
          restore_head
          trap - EXIT
          git diff --exit-code -- "${targets[@]}"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$red_tree"
          git diff --exit-code
      - name: GREEN boundary and existing stream regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          cd backend
          go test -tags=unit ./internal/handler ./internal/service ./internal/repository -run 'TestHTTP2|Test(CC|Responses)(Buffered|Streaming)FromNativeAnthropic|TestNativeAnthropic|TestProxyOpenAIWSHTTPBridge|TestPluginSSE|TestOpenAIStreaming|TestHandleChatStreaming|TestChatCompletionsBuffered|TestAnthropicBuffered|TestForwardAsAnthropic|TestForwardResponses|TestOpenAIImagesOAuthBodyRead|TestOps.*Stream|TestOpsBridge|TestAutoConfig|Test.*RawStream|Test.*StreamTruncat|Test.*ClientCancel|Test.*ClientDisconnect|Test.*Deadline|TestClassifyOpenAIAPIKeyHealth|TestOpsErrorWhere' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/http2-evidence/green.log"
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/green.log"; then exit 1; fi
          for test_name in TestHTTP2PeerResetBoundary TestHTTP2PeerResetBeforeHeaders TestHTTP2PeerResetBufferedBoundaries TestHTTP2PeerResetPartialImages TestHTTP2PeerResetPluginEarlyMetadata TestHTTP2SemanticImageErrorCannotSpoofReset TestHTTP2PeerResetNativeConversionBoundary TestHTTP2PeerResetNativeUsage TestHTTP2PeerResetImagesBeforeHeaders TestHTTP2PeerResetWebSocketTurnPersistence TestHTTP2NativeSemanticErrorBeforeReset TestHTTP2RawIncompleteErrorEventStillResets TestHTTP2CCSemanticFailureBeforeReset TestHTTP2CCIncompleteSemanticEventStillResets TestHTTP2CCNonContextSemanticStatusUnchanged TestHTTP2CCSemanticFailureOwnershipAndSLA TestHTTP2NativeRelayRequiresCompleteTerminal TestHTTP2NativeRelayCompleteTerminalControls; do
            grep -q -- "--- PASS: $test_name" "$RUNNER_TEMP/http2-evidence/green.log"
          done
      - name: Ordinary production build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          cd backend
          go build ./... 2>&1 | tee "$RUNNER_TEMP/http2-evidence/build.log"
      - name: Race boundary and stream lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          cd backend
          go test -race -tags=unit ./internal/handler ./internal/service -run 'TestHTTP2|TestOpenAIStreamingReadError|TestHandleChatStreamingResponse_ClassifiesHTTP2|TestAutoConfigRealRequestOutcomes|TestForwardAsAnthropic_ForceChatCompletionsStreamReadError' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/http2-evidence/race.log"
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/race.log"; then exit 1; fi
          for test_name in TestHTTP2PeerResetBoundary TestHTTP2PeerResetBeforeHeaders TestHTTP2PeerResetBufferedBoundaries TestHTTP2PeerResetPartialImages TestHTTP2PeerResetPluginEarlyMetadata TestHTTP2SemanticImageErrorCannotSpoofReset TestHTTP2PeerResetNativeConversionBoundary TestHTTP2PeerResetNativeUsage TestHTTP2PeerResetImagesBeforeHeaders TestHTTP2PeerResetWebSocketTurnPersistence TestHTTP2NativeSemanticErrorBeforeReset TestHTTP2RawIncompleteErrorEventStillResets TestHTTP2CCSemanticFailureBeforeReset TestHTTP2CCIncompleteSemanticEventStillResets TestHTTP2CCNonContextSemanticStatusUnchanged TestHTTP2CCSemanticFailureOwnershipAndSLA TestHTTP2NativeRelayRequiresCompleteTerminal TestHTTP2NativeRelayCompleteTerminalControls; do
            grep -q -- "--- PASS: $test_name" "$RUNNER_TEMP/http2-evidence/race.log"
          done
      - name: PostgreSQL persistence and monitor regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          cd backend
          go test -tags=integration ./internal/repository -run 'TestHTTP2AIOpsFailureIdentityScopedToAPIKey|TestHTTP2AIOpsEvidenceIncludesCommittedTransportFailure|TestHTTP2PeerResetPersistence|TestGetErrorLogByID_APIKeyPrefixAndUpstreamStatus|TestChannelMonitorV2.*Error' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/http2-evidence/persistence.log"
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/persistence.log"; then exit 1; fi
          grep -q -- '--- PASS: TestHTTP2PeerResetPersistence' "$RUNNER_TEMP/http2-evidence/persistence.log"
          grep -q -- '--- PASS: TestHTTP2AIOpsEvidenceIncludesCommittedTransportFailure' "$RUNNER_TEMP/http2-evidence/persistence.log"
          grep -q -- '--- PASS: TestHTTP2AIOpsFailureIdentityScopedToAPIKey' "$RUNNER_TEMP/http2-evidence/persistence.log"
          go test -race -tags=integration ./internal/repository -run '^TestHTTP2AIOps(FailureIdentityScopedToAPIKey|EvidenceIncludesCommittedTransportFailure)$' -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/http2-evidence/f1-race.log"
          if grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|race detected|signal: (killed|segmentation)' "$RUNNER_TEMP/http2-evidence/f1-race.log"; then exit 1; fi
          grep -q -- '--- PASS: TestHTTP2AIOpsEvidenceIncludesCommittedTransportFailure' "$RUNNER_TEMP/http2-evidence/f1-race.log"
          grep -q -- '--- PASS: TestHTTP2AIOpsFailureIdentityScopedToAPIKey' "$RUNNER_TEMP/http2-evidence/f1-race.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http2-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/http2-evidence/

  timezone-race:
    if: github.head_ref == 'fix/http2-reset-review-followup-20261114' || github.ref_name == 'fix/http2-reset-review-followup-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      TZ: UTC
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: 0c038c595c771c38f4e7d94b5022272b512662ac
          path: timezone-baseline
      - uses: actions/setup-go@v6
        with:
          go-version-file: candidate/backend/go.mod
          cache-dependency-path: candidate/backend/go.sum
      - name: Check changed Go formatting remotely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git -C candidate status --porcelain)"
          git -C candidate fetch --no-tags --depth=1 origin 0c038c595c771c38f4e7d94b5022272b512662ac
          (cd candidate && git diff --name-only --diff-filter=ACM 0c038c595c771c38f4e7d94b5022272b512662ac HEAD -- '*.go' | xargs -r gofmt -d) > evidence/timezone-gofmt.diff
          cat evidence/timezone-gofmt.diff
          test ! -s evidence/timezone-gofmt.diff
      - name: Original time.Local race on isolated pre-fix checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C timezone-baseline rev-parse HEAD > evidence/timezone-red-head.txt
          git -C candidate rev-parse HEAD > evidence/timezone-green-head.txt
          cp candidate/backend/internal/repository/custom_timezone_isolation_test.go timezone-baseline/backend/internal/repository/
          set +e
          (cd timezone-baseline/backend && go test -race -tags=unit ./internal/repository -run '^TestRepositoryTimezoneIsolation$' -count=1 -v) > evidence/timezone-red.log 2>&1
          result=$?
          set -e
          cat evidence/timezone-red.log
          printf '%s\n' "$result" > evidence/timezone-red-exit.txt
          test "$result" -ne 0
          ! grep -Eq -- 'build failed|setup failed|undefined:|syntax error:|no tests to run|panic:|signal:|SIGSEGV|--- SKIP:' evidence/timezone-red.log
          grep -F 'WARNING: DATA RACE' evidence/timezone-red.log
          grep -F 'internal/pkg/timezone.Init()' evidence/timezone-red.log
          grep -F 'time.Now()' evidence/timezone-red.log
          grep -F 'repository.useGroupUsageRepositoryTestTimezone()' evidence/timezone-red.log
      - name: Exact head isolated clocks and all repository timezone unit assertions
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate/backend && go test -race -tags=unit ./internal/repository -run '^TestRepositoryTimezoneIsolation$|^TestUsageTrend|^TestUsageLogRepositoryGetAllGroupUsageSummary|^TestDashboardAggregationRepository|^TestUsageCleanupRepository' -count=1 -v) 2>&1 | tee evidence/timezone-green.log
          ! grep -Eq -- 'WARNING: DATA RACE|--- SKIP:|no tests to run|build failed|panic:' evidence/timezone-green.log
          grep -q -- '--- PASS: TestRepositoryTimezoneIsolation' evidence/timezone-green.log
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git -C candidate status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http2-timezone-race-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/

  user-surface:
    if: github.head_ref == 'fix/http2-stream-error-clarity' || github.ref_name == 'fix/http2-stream-error-clarity' || github.head_ref == 'fix/http2-reset-review-followup-20261114' || github.ref_name == 'fix/http2-reset-review-followup-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: F2 behavioral RED through the actual UsageView status control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/http2-ui"
          target=frontend/src/views/user/UsageView.vue
          baseline=3137257829f0cc48466911aa4a249dd03f3c088f
          restore_usage_view() { git show "HEAD:$target" > "$target"; }
          trap restore_usage_view EXIT
          git show "$baseline:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
          git rev-parse HEAD "$baseline:$target" > "$RUNNER_TEMP/http2-ui/f2-red-identity.txt"
          set +e
          pnpm --dir frontend exec vitest run src/views/user/__tests__/UsageView.spec.ts > "$RUNNER_TEMP/http2-ui/f2-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/http2-ui/f2-red.log"
          test "$result" -eq 1
          if grep -Eiq 'No test files found|no tests|[0-9]+ skipped|Failed to resolve|Unhandled Errors|Unhandled Rejection|SyntaxError|ReferenceError|TypeError|Transform failed|panic|DATA RACE' "$RUNNER_TEMP/http2-ui/f2-red.log"; then exit 1; fi
          grep -q 'HTTP200 must be selectable from the real error status control' "$RUNNER_TEMP/http2-ui/f2-red.log"
          grep -q '1 failed' "$RUNNER_TEMP/http2-ui/f2-red.log"
          restore_usage_view
          trap - EXIT
          git diff --exit-code
      - name: Real component regressions and production frontend build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/http2-ui"
          git rev-parse HEAD > "$RUNNER_TEMP/http2-ui/head.txt"
          pnpm --dir frontend exec vitest run src/views/user/__tests__/UsageView.spec.ts src/components/user/__tests__/UserErrorTransport.spec.ts src/components/user/__tests__/UserErrorDetailModal.spec.ts 2>&1 | tee "$RUNNER_TEMP/http2-ui/component.log"
          if grep -Eiq 'No test files found|Unhandled Errors|Unhandled Rejection|Transform failed|panic|DATA RACE' "$RUNNER_TEMP/http2-ui/component.log"; then exit 1; fi
          pnpm --dir frontend run build 2>&1 | tee "$RUNNER_TEMP/http2-ui/build.log"
      - name: Isolated screenshot browser
        run: |
          npm install --prefix "$RUNNER_TEMP/http2-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/http2-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual component before and after in English and Chinese
        env:
          SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/http2-browser/node_modules/playwright/index.mjs
        run: node .github/http2-stream-reset-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/http2-ui"
      - name: Actual error-tab category and HTTP200 filter before and after
        env:
          SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/http2-browser/node_modules/playwright/index.mjs
        run: node .github/http2-user-filter-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/http2-ui/filters"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http2-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/http2-ui/
