name: Shadow delivery and privacy review repairs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/internal/handler/openai_409_*'
      - 'backend/internal/handler/security_audit_helper.go'
      - 'backend/internal/service/openai_409_*'
      - 'backend/internal/service/openai_agent_message*'
      - 'backend/internal/service/recovered_context_privacy.go'
      - 'backend/internal/service/content_moderation.go'
      - 'backend/internal/repository/gateway_cache_agent_shadow_epoch.go'
      - 'backend/internal/securityaudit/**'
      - '.github/scripts/assert-ws-readable.py'
      - '.github/scripts/test_assert_ws_readable.py'
      - '.github/workflows/shadow-review-repair.yml'
permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [RED, GREEN]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: shadow_audit
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture -d shadow_audit" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: e59321cbf7e919f980ca90690ec70159180761f2
      PHASE: ${{ matrix.phase }}
      PROMPT_AUDIT_TEST_POSTGRES_DSN: postgres://fixture:fixture@127.0.0.1:5432/shadow_audit?sslmode=disable
      PROMPT_AUDIT_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install isolated HTTP fixture Redis
        run: |
          bash .github/scripts/ci-ubuntu-mirrors.sh
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - name: Validator and immutable baseline assembly
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/shadow-repair-evidence"
          python3 -B -m unittest discover -s .github/scripts -p 'test_assert_ws_readable.py' -v 2>&1 | tee "$RUNNER_TEMP/shadow-repair-evidence/validator.log"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/shadow-repair-evidence/candidate.txt"
          git rev-parse "$BASELINE_SHA" > "$RUNNER_TEMP/shadow-repair-evidence/baseline.txt"
          if [ "$PHASE" = RED ]; then
            git worktree add --detach "$RUNNER_TEMP/shadow-review-red" "$CANDIDATE_SHA"
            cd "$RUNNER_TEMP/shadow-review-red"
            while IFS= read -r target; do
              case "$target" in *_test.go) continue ;; esac
              if git cat-file -e "$BASELINE_SHA:$target" 2>/dev/null; then
                git show "$BASELINE_SHA:$target" > "$target"
                test "$(git hash-object "$target")" = "$(git rev-parse "$BASELINE_SHA:$target")"
              else
                rm -- "$target"
              fi
            done < <(git diff --no-renames --name-only "$BASELINE_SHA" "$CANDIDATE_SHA" -- 'backend/**/*.go')
            git diff --exit-code "$BASELINE_SHA" -- 'backend/**/*.go' ':!backend/**/*_test.go'
          fi
          git diff --exit-code "$CANDIDATE_SHA" -- 'backend/**/*_test.go'
          for target in backend/internal/handler/openai_409_shadow_race_test.go backend/internal/handler/openai_409_shadow_http_test.go backend/internal/securityaudit/prompt_recovered_context_test.go backend/internal/service/openai_409_readable_shadow.go; do
            git hash-object "$target" >> "$RUNNER_TEMP/shadow-repair-evidence/blobs.txt"
          done
      - name: Actual publication races and persistent audit canaries
        run: |
          set -euo pipefail
          tested_tree="$GITHUB_WORKSPACE"
          if [ "$PHASE" = RED ]; then tested_tree="$RUNNER_TEMP/shadow-review-red"; fi
          for suite in shadow-races audit-provenance audit-persistence; do
            package=handler
            tags=unit
            case "$suite" in
              shadow-races) root=TestOpenAI409FutureShadowPublicationFences ;;
              audit-provenance) root=TestOpenAI409FutureShadowAuditProvenance ;;
              audit-persistence) root=TestRecoveredContextAuditPersistence; package=securityaudit; tags=integration ;;
            esac
            set +e
            (cd "$tested_tree/backend" && go test -race -json -tags="$tags" "./internal/$package" -run "^${root}$" -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl"
            python3 .github/scripts/assert-ws-readable.py "$PHASE" "$result" "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl" "$suite"
          done
      - name: GREEN OAuth final-wire shadow and pointers without opaque owners
        if: matrix.phase == 'GREEN'
        run: |
          set -euo pipefail
          for suite in oauth-shadow pointer pointer-boundaries; do
            case "$suite" in
              oauth-shadow) root=TestOpenAI409FutureShadowOAuth ;;
              pointer) root=TestOpenAI409HTTPReadablePointerWithoutOpaque ;;
              pointer-boundaries) root=TestOpenAI409HTTPPointerWithoutOpaqueBoundaries ;;
            esac
            set +e
            (cd backend && go test -race -json -tags=unit ./internal/handler -run "^${root}$" -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl"
            python3 .github/scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl" "$suite"
          done
      - name: Async penalty and admission counterexamples on reviewed d023
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tested_tree="$GITHUB_WORKSPACE"
          baseline=d023408b8a48eac7247faad17086e2aa7c7107e9
          git rev-parse "$baseline" > "$RUNNER_TEMP/shadow-repair-evidence/async-baseline.txt"
          if [ "$PHASE" = RED ]; then
            git worktree add --detach "$RUNNER_TEMP/async-review-red" "$CANDIDATE_SHA"
            tested_tree="$RUNNER_TEMP/async-review-red"
            while IFS= read -r target; do
              case "$target" in *_test.go) continue ;; esac
              if git cat-file -e "$baseline:$target" 2>/dev/null; then
                git show "$baseline:$target" > "$tested_tree/$target"
                test "$(git hash-object "$tested_tree/$target")" = "$(git rev-parse "$baseline:$target")"
              else
                rm -- "$tested_tree/$target"
              fi
            done < <(git diff --no-renames --name-only "$baseline" "$CANDIDATE_SHA" -- 'backend/**/*.go')
            git -C "$tested_tree" diff --exit-code "$baseline" -- 'backend/**/*.go' ':!backend/**/*_test.go'
          fi
          git -C "$tested_tree" diff --exit-code "$CANDIDATE_SHA" -- 'backend/**/*_test.go'
          for target in backend/internal/securityaudit/prompt_service.go backend/internal/securityaudit/prompt_repository.go backend/internal/securityaudit/prompt_recovered_context_test.go; do
            git hash-object "$tested_tree/$target" >> "$RUNNER_TEMP/shadow-repair-evidence/async-blobs.txt"
          done
          set +e
          (cd "$tested_tree/backend" && go test -race -json -tags=integration ./internal/securityaudit -run '^TestRecoveredContextAsyncEnforcement$' -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl"
          python3 .github/scripts/assert-ws-readable.py "$PHASE" "$result" "$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl" audit-async
      - name: Actual HTTP and socket ambiguous-oracle mutations
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          set +e
          (cd backend && go test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409WSAmbiguousOracleMutations$' -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl"
          python3 .github/scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl" ws-oracle
      - name: Inspect strict pointer baseline without inventing a RED
        if: matrix.phase == 'RED'
        run: |
          set -euo pipefail
          set +e
          (cd "$RUNNER_TEMP/shadow-review-red/backend" && go test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409HTTPPointerWithoutOpaqueBoundaries$/.*/.*/strict$' -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl"
          phase=RED
          if [ "$result" = 0 ]; then phase=GREEN; fi
          python3 .github/scripts/assert-ws-readable.py "$phase" "$result" "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl" strict-pointer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shadow-review-repair-${{ matrix.phase }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/shadow-repair-evidence/
          if-no-files-found: error
