name: Scheduler outbox retry regression
on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/service/scheduler_snapshot*'
      - 'backend/internal/service/scheduler_outbox.go'
      - 'backend/internal/service/openai_codex_snapshot_contract.go'
      - 'backend/internal/repository/scheduler_outbox*'
      - 'backend/migrations/*scheduler_outbox_retries.sql'
      - '.github/workflows/scheduler-outbox-retry.yml'
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Event preservation, retry failure and existing lifecycle boundaries
        working-directory: backend
        run: >-
          go test -race -tags=unit ./internal/service
          -run '^(TestSchedulerOutboxRetry|TestSchedulerSnapshotServicePollOutbox|TestSchedulerSnapshotServiceCheckOutboxLag|TestSchedulerFullRebuild|TestSchedulerGroupLifecycle|TestSchedulerPrepareGroupLifecycle)'
          -count=1 -timeout=5m
      - name: Durable PostgreSQL retry copying, cleanup, lease and restart
        working-directory: backend
        env:
          CI: 'true'
          GOTRACEBACK: crash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          uname -a > ../evidence/kernel.txt
          go version > ../evidence/toolchain.txt
          go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN >> ../evidence/toolchain.txt
          docker version > ../evidence/docker-version.txt
          docker info > ../evidence/docker-info.txt
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb
          fi
          ulimit -c unlimited
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/scheduler-retry.core.%p" > ../evidence/core-pattern.txt
          export GORACE="log_path=$PWD/../evidence/race history_size=4"
          binary="$RUNNER_TEMP/scheduler-retry.test"
          go test -c -race -tags=integration ./internal/repository -o "$binary"
          set +e
          "$binary" -test.run '^TestSchedulerOutboxRetryPostgres' -test.count=1 -test.v=true -test.timeout=10m > ../evidence/integration.log 2>&1
          result=$?
          set -e
          cat ../evidence/integration.log
          printf '%s\n' "$result" > ../evidence/exit.txt
          if [ "$result" -ne 0 ]; then
            for core in "$RUNNER_TEMP"/scheduler-retry.core.*; do
              [ -f "$core" ] || continue
              # Core files inherit the runner environment. Only retain a
              # backtrace without argument/local values, never the raw core.
              gdb -batch -ex 'set print frame-arguments none' -ex 'thread apply all bt' \
                "$binary" "$core" > "../evidence/backtrace-$(basename "$core").txt" 2>&1 || true
            done
          fi
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-outbox-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
