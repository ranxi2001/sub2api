name: Keys usage layout

on:
  push:
    branches: [fix/keys-usage-layout-20261108]
  pull_request:
    paths:
      - 'frontend/src/views/user/KeysView.vue'
      - 'frontend/src/components/common/DataTable.vue'
      - 'frontend/src/components/common/GroupBadge.vue'
      - 'frontend/src/components/layout/TablePageLayout.vue'
      - 'frontend/src/features/ip-audit/UserKeyRiskNotices.vue'
      - 'frontend/src/features/ip-audit/__tests__/UserKeyRiskNotices.spec.ts'
      - 'frontend/src/views/user/__tests__/KeysView.spec.ts'
      - 'frontend/src/i18n/locales/*/ipAudit.ts'
      - '.github/scripts/keys-usage-layout-browser.mjs'
      - '.github/workflows/keys-usage-layout.yml'

permissions:
  contents: read

concurrency:
  group: keys-usage-layout-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Keys page and risk notice regressions
        run: pnpm --dir frontend exec vitest run src/views/user/__tests__/KeysView.spec.ts src/features/ip-audit/__tests__/UserKeyRiskNotices.spec.ts
      - name: Build production frontend
        run: pnpm --dir frontend run build
      - name: Install isolated CI browser
        run: |
          npm install --prefix "$RUNNER_TEMP/keys-layout-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/keys-layout-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render actual Keys page with synthetic data
        env:
          KEYS_LAYOUT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          KEYS_LAYOUT_SCREENSHOT_DIR: ${{ runner.temp }}/keys-layout-screenshots
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/keys-layout-browser/node_modules/playwright
        run: node .github/scripts/keys-usage-layout-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keys-layout-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/keys-layout-screenshots
