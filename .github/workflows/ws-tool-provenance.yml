name: WS tool provenance F1

on:
  pull_request:
    branches: [production]
    paths:
      - backend/internal/handler/openai*go
      - backend/internal/service/openai*go
      - .github/workflows/ws-tool-provenance.yml
      - .github/scripts/ws-owner-conflict-evidence.py
      - .github/scripts/ws-tool-provenance-evidence.py
      - .github/scripts/issue871-evidence.py
      - .github/scripts/test_issue871_evidence.py
      - .github/scripts/prepare-usage-sort-red-fixture.sh
      - backend/internal/repository/gateway_cache_tool_provenance.go

permissions:
  contents: read

jobs:
  pending-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PENDING_BASELINE: eb2addba4de284f2844eb7450a9e872efbce03b0
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate named behavioral evidence gates
        run: python3 -m unittest discover -s .github/scripts -p 'test_issue871_evidence.py'
      - name: Pending wait RED on exact baseline with identical candidate tests
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ws-pending-evidence"
          red_dir="$RUNNER_TEMP/ws-pending-red"
          fixture=backend/internal/service/openai_ws_owner_conflict_test.go
          mkdir -p "$evidence_dir"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$evidence_dir/candidate.txt"
          git rev-parse "$PENDING_BASELINE" "$PENDING_BASELINE^{tree}" > "$evidence_dir/baseline.txt"
          git worktree add --detach "$red_dir" "$PENDING_BASELINE"
          git show "$CANDIDATE:$fixture" > "$red_dir/$fixture"
          test "$(git hash-object "$red_dir/$fixture")" = "$(git rev-parse "$CANDIDATE:$fixture")"
          git rev-parse "$CANDIDATE:$fixture" > "$evidence_dir/fixture-blob.txt"
          cp "$red_dir/$fixture" "$evidence_dir/pending_test.go"
          git -C "$red_dir" diff --exit-code "$PENDING_BASELINE" -- . ":(exclude)$fixture"
          git -C "$red_dir" diff --stat > "$evidence_dir/red-diff.txt"
          git ls-tree -r "$PENDING_BASELINE" -- backend > "$evidence_dir/baseline-blobs.txt"
          set +e
          (cd "$red_dir/backend" && go test -tags=unit,ownerconflict ./internal/service -run '^TestOpenAIToolProvenancePendingDeadline$/^function$/^pending_deadline$' -count=1 -json -timeout=5m) > "$evidence_dir/red.jsonl" 2> "$evidence_dir/red.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence_dir/red-exit.txt"
          python3 .github/scripts/issue871-evidence.py RED "$status" "$evidence_dir/red.jsonl" "$evidence_dir/red.stderr" pending_deadline
          test "$(git -C "$red_dir" rev-parse HEAD)" = "$PENDING_BASELINE"
          git -C "$red_dir" diff --exit-code "$PENDING_BASELINE" -- . ":(exclude)$fixture"
      - name: Pending wait GREEN and deterministic backend error controls with race detection
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ws-pending-evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          set +e
          (cd backend && go test -race -tags=unit,ownerconflict ./internal/service -run '^TestOpenAIToolProvenancePendingDeadline$/^function$/^pending_deadline$' -count=1 -json -timeout=5m) > "$evidence_dir/green.jsonl" 2> "$evidence_dir/green.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence_dir/green-exit.txt"
          python3 .github/scripts/issue871-evidence.py GREEN "$status" "$evidence_dir/green.jsonl" "$evidence_dir/green.stderr" pending_deadline
          (cd backend && go test -race -tags=unit,ownerconflict ./internal/service -run '^TestOpenAIToolProvenancePendingDeadline$' -count=1 -json -timeout=5m) > "$evidence_dir/controls.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$evidence_dir/controls.jsonl"
          python3 - "$evidence_dir/controls.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          for kind in ('function','custom'):
              for case in ('pending_deadline','initial_deadline','initial_store_failure','initial_backend_deadline','pending_store_failure','pending_backend_deadline','pending_store_failure_at_deadline'):
                  name=f'TestOpenAIToolProvenancePendingDeadline/{kind}/{case}'
                  assert sum(r.get('Action')=='pass' and r.get('Test')==name for r in rows)==1,name
          assert not any(r.get('Action') in ('fail','skip') for r in rows)
          PY
      - name: Build production server at exact candidate
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/ws-pending-server" ./cmd/server
          sha256sum "$RUNNER_TEMP/ws-pending-server" > "$RUNNER_TEMP/ws-pending-evidence/server-sha256.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ws-pending-deadline-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ws-pending-evidence
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE: ${{ github.event.pull_request.head.sha }}
      BASELINE: 18aef10f71a6a68372a124f2684ecb18024318bb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install isolated Redis
        run: |
          bash .github/scripts/ci-ubuntu-mirrors.sh
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - name: Real handler RED against exact production blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/ws-provenance-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ws-provenance-evidence/candidate.txt"
          git worktree add --detach "$RUNNER_TEMP/ws-provenance-red" "$CANDIDATE"
          git diff --name-only "$BASELINE" "$CANDIDATE" -- backend | while IFS= read -r target; do
            case "$target" in
              *_test.go) continue ;;
              *.go)
                if git cat-file -e "$BASELINE:$target" 2>/dev/null; then
                  mkdir -p -- "$(dirname -- "$RUNNER_TEMP/ws-provenance-red/$target")"
                  git show "$BASELINE:$target" > "$RUNNER_TEMP/ws-provenance-red/$target"
                  test "$(git hash-object "$RUNNER_TEMP/ws-provenance-red/$target")" = "$(git rev-parse "$BASELINE:$target")"
                  printf '%s %s\n' "$(git rev-parse "$BASELINE:$target")" "$target" >> "$RUNNER_TEMP/ws-provenance-evidence/baseline-blobs.txt"
                else
                  rm -- "$RUNNER_TEMP/ws-provenance-red/$target"
                fi ;;
            esac
          done
          bash .github/scripts/prepare-free-fast-red-fixtures.sh "$BASELINE" "$RUNNER_TEMP/ws-provenance-red" "$CANDIDATE"
          bash .github/scripts/prepare-usage-sort-red-fixture.sh "$BASELINE" "$RUNNER_TEMP/ws-provenance-red" "$CANDIDATE"
          set +e
          (cd "$RUNNER_TEMP/ws-provenance-red/backend" && go test -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenance$' -count=1 -json -timeout=2m) > "$RUNNER_TEMP/ws-provenance-evidence/red.jsonl" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ws-provenance-evidence/red.jsonl"
          test "$status" -eq 1
          python3 .github/scripts/ws-tool-provenance-evidence.py RED "$status" "$RUNNER_TEMP/ws-provenance-evidence/red.jsonl"
      - name: Candidate provenance GREEN
        if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --exit-code
          set +e
          (cd backend && go test -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenance$' -count=1 -json -timeout=3m) > "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl"
          python3 .github/scripts/ws-tool-provenance-evidence.py GREEN "$status" "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl"
          set +e
          (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenance$' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl"
          python3 .github/scripts/ws-tool-provenance-evidence.py GREEN "$status" "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl"
      - name: Genuine delivery, mutations and task association
        if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenanceCases$' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl"
          python3 - "$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          for kind in ('function','custom'):
              for case in ('valid','id','type','name','args','epoch','unrelated','undelivered','proof_pending','proof_failed','proof_conflict','proof_missing'):
                  name=f'TestOpenAIWSMixedOwnerToolProvenanceCases/{kind}/{case}'
                  assert sum(r.get('Action')=='pass' and r.get('Test')==name for r in rows)==1,name
          assert not any(r.get('Action') in ('fail','skip') for r in rows)
          PY
      - name: Shadow provenance and delivery lifecycle
        if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSShadowToolProvenance$' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/ws-provenance-evidence/shadow.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/ws-provenance-evidence/shadow.jsonl"
          (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/service -run '^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences)$' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/ws-provenance-evidence/delivery.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/ws-provenance-evidence/delivery.jsonl"
          python3 - "$RUNNER_TEMP/ws-provenance-evidence" <<'PY'
          import json,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          for filename,tests in [('shadow.jsonl',{f'TestOpenAIWSShadowToolProvenance/{kind}/{case}' for kind in ('function','custom') for case in ('valid','phantom','epoch')}),('delivery.jsonl',{'TestOpenAIToolProvenanceDeliveryAndScope','TestOpenAIWSMixedOwnerFinalSendFences'})]:
              rows=[json.loads(line) for line in (root/filename).read_text().splitlines() if line.startswith('{')]
              for name in tests: assert sum(r.get('Action')=='pass' and r.get('Test')==name for r in rows)==1,name
              assert not any(r.get('Action') in ('fail','skip') for r in rows)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ws-tool-provenance-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ws-provenance-evidence
