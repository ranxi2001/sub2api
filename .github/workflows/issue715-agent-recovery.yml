name: Issue715 agent continuation

on:
  pull_request:
    branches: [production]
    paths:
      - '.github/workflows/issue715-agent-recovery.yml'
      - 'backend/internal/service/openai_*'
      - 'backend/internal/handler/openai_*'
      - 'backend/internal/repository/gateway_cache_agent_recovery*'
      - 'backend/internal/repository/gateway_cache_integration_test.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue715-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Exact clean candidate GREEN
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          cd backend
          go test -race -tags=unit ./internal/service ./internal/handler ./internal/repository -run '^Test(Issue715|AstraCodexToolCapabilities|EncryptedSticky|EncryptedPrioritySticky|OpenAIGatewayService_SelectAccountWithScheduler_Encrypted)' -count=1 -v -timeout=10m
          go test -tags=integration ./internal/repository -run '^TestGatewayCacheSuite$' -testify.m '^TestIssue715AgentOwnership$' -count=1 -v -timeout=5m

  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pinned original production with the same new regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=6df0cd5bb0ce4d774d34004008f9dd661d236468
          targets=(backend/internal/service/openai_codex_model_metadata.go backend/internal/service/openai_codex_models_service.go backend/internal/service/openai_excel_bps_models_manifest.go)
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "${targets[@]}"; git diff --exit-code' EXIT
          git restore --source="$original" -- "${targets[@]}"
          for target in "${targets[@]}"; do
            expected=$(git rev-parse "$original:$target")
            actual=$(git hash-object "$target")
            echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
            test "$expected" = "$actual"
          done
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^TestIssue715(BridgeDoesNotAdvertiseEncryptedAgent|FetchedAndPinnedBridgeCapabilities|LiveBridgeCapabilityCannotOverrideWire)$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/issue715-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:' "$RUNNER_TEMP/issue715-red.log"
          grep -q -- '--- FAIL: TestIssue715BridgeDoesNotAdvertiseEncryptedAgent' "$RUNNER_TEMP/issue715-red.log"
          grep -q 'bridge must not create unreadable encrypted tasks' "$RUNNER_TEMP/issue715-red.log"
          grep -q -- '--- FAIL: TestIssue715FetchedAndPinnedBridgeCapabilities' "$RUNNER_TEMP/issue715-red.log"
          grep -q 'bridge capability repair must invalidate the native ETag' "$RUNNER_TEMP/issue715-red.log"
          grep -q -- '--- FAIL: TestIssue715LiveBridgeCapabilityCannotOverrideWire' "$RUNNER_TEMP/issue715-red.log"
          grep -q 'live bridge manifest must not restore v2' "$RUNNER_TEMP/issue715-red.log"

  red-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Original business chain with retained new handler regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=6df0cd5bb0ce4d774d34004008f9dd661d236468
          targets=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_account_scheduler.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_gateway_response_handling.go backend/internal/service/openai_gateway_service.go backend/internal/service/openai_ws_forwarder_ingress.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_pool.go)
          added=(backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_agent_message_recovery_cache.go backend/internal/service/openai_agent_message_delivery.go backend/internal/repository/gateway_cache_agent_recovery.go backend/internal/service/openai_ws_agent_recovery.go)
          # The exact original gateway struct predates analysis admission state.
          # Pin this unrelated leaf to its pre-admission version, preserving all
          # Issue715 business-chain blobs and the retained handler regressions.
          analysis_compat=e395038e98fbc5a0c44944f0edcfbfe714570f71
          analysis_leaf=backend/internal/service/priority_analysis.go
          git fetch --no-tags --depth=1 origin "$original"
          git fetch --no-tags --depth=1 origin "$analysis_compat"
          trap 'git restore --source=HEAD -- "${targets[@]}" "${added[@]}" "$analysis_leaf"; git diff --exit-code' EXIT
          git restore --source="$original" -- "${targets[@]}"
          git restore --source="$analysis_compat" -- "$analysis_leaf"
          expected=$(git rev-parse "$analysis_compat:$analysis_leaf")
          actual=$(git hash-object "$analysis_leaf")
          echo "compatibility_leaf_baseline=$analysis_compat path=$analysis_leaf expected_blob=$expected tested_blob=$actual"
          test "$expected" = "$actual"
          rm -- "${added[@]}"
          for target in "${targets[@]}"; do
            expected=$(git rev-parse "$original:$target")
            actual=$(git hash-object "$target")
            echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
            test "$expected" = "$actual"
          done
          for path in "${added[@]}"; do test ! -e "$path"; done
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestIssue715HTTPResumesSameTaskAcrossTwoTurns$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/issue715-recovery-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-recovery-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:' "$RUNNER_TEMP/issue715-recovery-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPResumesSameTaskAcrossTwoTurns/false' "$RUNNER_TEMP/issue715-recovery-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPResumesSameTaskAcrossTwoTurns/true' "$RUNNER_TEMP/issue715-recovery-red.log"
          grep -q 'same task and tool context must survive route drift' "$RUNNER_TEMP/issue715-recovery-red.log"

  red-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Reviewed head with retained downstream failure regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=18b7c0a4f5f4306a9c92f9715f08164f520df457
          target=backend/internal/service/openai_gateway_response_handling.go
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "$target"; git diff --exit-code' EXIT
          git restore --source="$original" -- "$target"
          expected=$(git rev-parse "$original:$target")
          actual=$(git hash-object "$target")
          echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
          test "$expected" = "$actual"
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestIssue715HTTPFailedDeliveryNeverGrantsOwner$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/issue715-delivery-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-delivery-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:' "$RUNNER_TEMP/issue715-delivery-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPFailedDeliveryNeverGrantsOwner/json/error' "$RUNNER_TEMP/issue715-delivery-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPFailedDeliveryNeverGrantsOwner/aggregate/error' "$RUNNER_TEMP/issue715-delivery-red.log"
          grep -q 'failed downstream delivery must not grant a successful owner' "$RUNNER_TEMP/issue715-delivery-red.log"

  red-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Reviewed output path with retained generated-task regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=b6d780f1a4fee66c2930219dfe9e400b8f0279de
          target=backend/internal/service/openai_gateway_response_handling.go
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "$target"; git diff --exit-code' EXIT
          git restore --source="$original" -- "$target"
          expected=$(git rev-parse "$original:$target")
          actual=$(git hash-object "$target")
          echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
          test "$expected" = "$actual"
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestIssue715HTTPGeneratedTaskReturnsToItsProducer$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/issue715-generated-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-generated-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:' "$RUNNER_TEMP/issue715-generated-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPGeneratedTaskReturnsToItsProducer/generated-json' "$RUNNER_TEMP/issue715-generated-red.log"
          grep -q -- '--- FAIL: TestIssue715HTTPGeneratedTaskReturnsToItsProducer/generated-stream-items' "$RUNNER_TEMP/issue715-generated-red.log"
          grep -q 'newly generated task must return to its producer before any prior successful input' "$RUNNER_TEMP/issue715-generated-red.log"

  red-first-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Reviewed pre-fix delivery order with identical barrier regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=242f5b0892a59d95005099e6294262b066bd2f8b
          targets=(backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_agent_message_recovery_cache.go backend/internal/repository/gateway_cache_agent_recovery.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_gateway_response_handling.go)
          added=backend/internal/service/openai_agent_message_delivery.go
          ws_original=a575df898ccd0876c4c0eb1559da38cedfdfe99d
          ws_targets=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_forwarder_ingress.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_pool.go)
          ws_added=backend/internal/service/openai_ws_agent_recovery.go
          git fetch --no-tags --depth=1 origin "$original"
          git fetch --no-tags --depth=1 origin "$ws_original"
          trap 'git restore --source=HEAD -- "${targets[@]}" "$added" "${ws_targets[@]}" "$ws_added"; git diff --exit-code' EXIT
          git restore --source="$original" -- "${targets[@]}"
          git restore --source="$ws_original" -- "${ws_targets[@]}"
          rm -- "$added" "$ws_added"
          for target in "${targets[@]}"; do
            expected=$(git rev-parse "$original:$target")
            actual=$(git hash-object "$target")
            echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
            test "$expected" = "$actual"
          done
          set +e
          (cd backend && go test -race -tags=unit ./internal/handler -run '^TestIssue715HTTPFirstDeliveryCrossNodeBarrier$/(generated-json|generated-stream|generated-stream-items)$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue715-first-delivery-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-first-delivery-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:|DATA RACE|fixture barrier not reached' "$RUNNER_TEMP/issue715-first-delivery-red.log"
          for format in generated-json generated-stream generated-stream-items; do
            grep -q -- "--- FAIL: TestIssue715HTTPFirstDeliveryCrossNodeBarrier/$format" "$RUNNER_TEMP/issue715-first-delivery-red.log"
          done
          grep -q 'client-visible first delivery must not race shared ownership' "$RUNNER_TEMP/issue715-first-delivery-red.log"

  red-ws-bridge-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pre-fix bridge with unchanged two-continuation socket regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=d91d890049a9bd8bd0e414f30b0cb3b5bcc0f06e
          target=backend/internal/service/openai_ws_forwarder_ingress.go
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "$target"; git diff --exit-code' EXIT
          git restore --source="$original" -- "$target"
          expected=$(git rev-parse "$original:$target")
          actual=$(git hash-object "$target")
          echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
          test "$expected" = "$actual"
          set +e
          (cd backend && go test -race -tags=unit ./internal/handler -run '^TestIssue715WSGeneratedTaskContinuation$/http_bridge/cross-node=false$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:|DATA RACE|--- SKIP:' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"
          grep -q -- '--- FAIL: TestIssue715WSGeneratedTaskContinuation/http_bridge/cross-node=false' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"
          grep -q 'generated WS task must continue without rebuilding the session' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

  red-ws-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pre-fix bridge with unchanged actual-body regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=e7f54240d83765c90a98e961ad5e33b0fa35ab56
          target=backend/internal/service/openai_ws_agent_recovery.go
          caller=backend/internal/service/openai_ws_forwarder_ingress.go
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "$target" "$caller"; git diff --exit-code' EXIT
          git restore --source="$original" -- "$target" "$caller"
          expected=$(git rev-parse "$original:$target")
          actual=$(git hash-object "$target")
          echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
          test "$expected" = "$actual"
          expected_caller=$(git rev-parse "$original:$caller")
          actual_caller=$(git hash-object "$caller")
          echo "baseline=$original path=$caller expected_blob=$expected_caller tested_blob=$actual_caller"
          test "$expected_caller" = "$actual_caller"
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^TestIssue715WSBridgeValidatesBuiltPayload$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue715-ws-wire-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-ws-wire-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:|--- SKIP:' "$RUNNER_TEMP/issue715-ws-wire-red.log"
          grep -q -- '--- FAIL: TestIssue715WSBridgeValidatesBuiltPayload' "$RUNNER_TEMP/issue715-ws-wire-red.log"
          grep -q 'bridge must validate actual built HTTP body before granting opaque task admission' "$RUNNER_TEMP/issue715-ws-wire-red.log"

  ws-real-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Exact-head WS socket chain using real Redis adapters
        env:
          ISSUE715_REDIS_ADDR: 127.0.0.1:6379
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          cd backend
          go test -race -tags=unit ./internal/handler -run '^TestIssue715WS' -count=1 -v -timeout=5m

  red-ws:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pinned pre-WS production with identical socket regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          original=a575df898ccd0876c4c0eb1559da38cedfdfe99d
          targets=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_forwarder_ingress.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_pool.go)
          added=backend/internal/service/openai_ws_agent_recovery.go
          git fetch --no-tags --depth=1 origin "$original"
          trap 'git restore --source=HEAD -- "${targets[@]}" "$added"; git diff --exit-code' EXIT
          git restore --source="$original" -- "${targets[@]}"
          rm -- "$added"
          for target in "${targets[@]}"; do
            expected=$(git rev-parse "$original:$target")
            actual=$(git hash-object "$target")
            echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"
            test "$expected" = "$actual"
          done
          set +e
          (cd backend && go test -race -tags=unit ./internal/handler -run '^TestIssue715WSGeneratedTaskContinuation$/.*/cross-node=true$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue715-ws-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue715-ws-red.log"
          test "$result" -ne 0
          ! grep -Eq 'build failed|no tests to run|undefined:|panic:|DATA RACE|--- SKIP:' "$RUNNER_TEMP/issue715-ws-red.log"
          for mode in ctx_pool passthrough http_bridge; do
            grep -q -- "--- FAIL: TestIssue715WSGeneratedTaskContinuation/$mode/cross-node=true" "$RUNNER_TEMP/issue715-ws-red.log"
          done
          grep -q 'generated opaque WS task and tool result must return to producer' "$RUNNER_TEMP/issue715-ws-red.log"

  deadline-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Original SQL deadline with PostgreSQL lock snapshots
        shell: bash
        run: |
          #!/usr/bin/env bash
          # CI-only diagnostic. Do not run in the local worktree.
          # Invoke at repository root after actions/setup-go. Docker is required.
          # Upload $RUNNER_TEMP/issue715-deadline-diag with if: always().
          set -euo pipefail
          issue715_diag_dir="${RUNNER_TEMP:?}/issue715-deadline-diag"
          mkdir -p "$issue715_diag_dir"
          git rev-parse HEAD > "$issue715_diag_dir/head.txt"
          git diff --exit-code -- backend/internal/repository/ops_repo_dashboard.go backend/internal/repository/ops_repo_dashboard_integration_test.go backend/internal/repository/integration_harness_test.go backend/go.mod backend/go.sum
          # Preserve the original test's 50 ms request deadline and real lock fixture.
          # -timeout only caps this diagnostic process, not the asserted deadline.
          (
            cd backend
            go test -tags=integration ./internal/repository -run '^TestOpsOutputTPSQueryDeadline$' -count=20 -v -timeout=2m
          ) > "$issue715_diag_dir/test.log" 2>&1 &
          issue715_diag_pid=$!
          issue715_diag_samples=0
          while kill -0 "$issue715_diag_pid" 2>/dev/null; do
            # The repository harness owns these ephemeral containers. No published
            # PostgreSQL host port or testsupport API is needed: psql is inside the image.
            # This job must run alone on its runner (normal Actions job isolation).
            while IFS= read -r issue715_diag_container; do
              test -n "$issue715_diag_container" || continue
              issue715_diag_samples=$((issue715_diag_samples + 1))
              date -u +'%Y-%m-%dT%H:%M:%S.%NZ' >> "$issue715_diag_dir/postgres-state.log"
              docker inspect --format '{{.Id}} {{.Config.Image}} {{.State.Status}} {{.State.StartedAt}}' "$issue715_diag_container" >> "$issue715_diag_dir/postgres-state.log" 2>&1 || true
              timeout 4s docker exec -e PGCONNECT_TIMEOUT=2 "$issue715_diag_container" psql -X -U postgres -d sub2api_test -v ON_ERROR_STOP=1 -P pager=off -c "SELECT clock_timestamp() AS captured_at, pid, backend_start, xact_start, query_start, state_change, state, wait_event_type, wait_event, pg_blocking_pids(pid) AS blockers, left(query,1600) AS query FROM pg_stat_activity WHERE datname='sub2api_test' AND pid<>pg_backend_pid() ORDER BY pid; SELECT pid, locktype, relation::regclass AS relation, virtualtransaction, virtualxid, transactionid, mode, granted, waitstart FROM pg_locks WHERE database=(SELECT oid FROM pg_database WHERE datname='sub2api_test') ORDER BY pid, granted, locktype, mode;" >> "$issue715_diag_dir/postgres-state.log" 2>&1 || true
              docker logs --timestamps --tail=100 "$issue715_diag_container" > "$issue715_diag_dir/postgres-${issue715_diag_container}.log" 2>&1 || true
            done < <(docker ps -q --filter label=org.testcontainers=true --filter ancestor=postgres:18.1-alpine3.23)
            sleep 1
          done
          set +e
          wait "$issue715_diag_pid"
          issue715_diag_result=$?
          set -e
          cat "$issue715_diag_dir/test.log"
          printf 'exit=%s postgres_samples=%s\n' "$issue715_diag_result" "$issue715_diag_samples" | tee "$issue715_diag_dir/result.txt"
          if test "$issue715_diag_result" -ne 0; then
            # Expose useful state near a timeout without dumping the whole polling file.
            tail -n 160 "$issue715_diag_dir/postgres-state.log" 2>/dev/null || true
            exit "$issue715_diag_result"
          fi
          # Docker absence/fixture failure/no tests must not become a diagnostic PASS.
          test "$issue715_diag_samples" -gt 0
          test "$(grep -c '^=== RUN   TestOpsOutputTPSQueryDeadline$' "$issue715_diag_dir/test.log")" -eq 20
          test "$(grep -c '^--- PASS: TestOpsOutputTPSQueryDeadline ' "$issue715_diag_dir/test.log")" -eq 20
          ! grep -En '^--- (FAIL|SKIP):|panic:|\[build failed\]|\[no tests to run\]|skipping integration tests' "$issue715_diag_dir/test.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue715-deadline-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue715-deadline-diag/
