name: Issue959 gateway regression

on:
  workflow_dispatch:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/domain/constants.go'
      - 'backend/internal/service/**'
      - 'backend/internal/repository/concurrency_cache*'
      - 'backend/internal/repository/integration_harness_test.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - '.github/workflows/issue959-gateway-regression.yml'

permissions:
  contents: read

concurrency:
  group: issue959-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Temporary Draft evidence entry; archive it after the feature is accepted.
jobs:
  request-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: issue959
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d issue959"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUB2API_TEST_POSTGRES_DSN: postgres://fixture:fixture@127.0.0.1:15432/issue959?sslmode=disable
      SUB2API_TEST_REDIS_URL: redis://127.0.0.1:16379/0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Record exact head
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          go version | tee evidence/toolchain.txt
      - name: Request target accounting and legacy regression with race detector
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=unit ./internal/service \
            -run '^Test(GatewayIdentity|GatewayUsage|NewAPIGateway|NewAPICostRequest|NewAPICostScale|UsagePlatformSnapshots)' \
            -count=1 -v -timeout=10m 2>&1 | tee ../evidence/unit-race.log
          if grep -Eq -- 'no tests to run|--- SKIP:' ../evidence/unit-race.log; then
            exit 1
          fi
          grep -F -- '--- PASS: TestGatewayUsageWritersSnapshotRequestTarget' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestNewAPIGatewayCostsFollowRequestTargetWithoutSharedWrites' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestUsagePlatformSnapshotsSelectedAccount' ../evidence/unit-race.log
      - name: Shared account slots against isolated Redis
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=integration ./internal/repository \
            -run '^TestConcurrencyCacheSuite$/^TestGatewayTargetsShareAccountConcurrency$' \
            -count=1 -v -timeout=10m 2>&1 | tee ../evidence/concurrency-redis.log
          if grep -Eq -- 'no tests to run|--- SKIP:' ../evidence/concurrency-redis.log; then
            exit 1
          fi
          grep -F -- '--- PASS: TestConcurrencyCacheSuite/TestGatewayTargetsShareAccountConcurrency' ../evidence/concurrency-redis.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue959-first-slice-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
