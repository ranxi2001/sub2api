name: Issue959 gateway regression

on:
  workflow_dispatch:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/domain/constants.go'
      - 'backend/internal/service/**'
      - 'backend/internal/handler/admin/account*'
      - 'backend/internal/handler/dto/account_mapper_redact_test.go'
      - 'backend/internal/repository/account_repo.go'
      - 'backend/internal/repository/group_repo.go'
      - 'backend/internal/repository/gateway_account*'
      - 'backend/internal/repository/gateway_request_admission*'
      - 'backend/internal/repository/gateway_request_candidates*'
      - 'backend/internal/handler/gateway_messages_selection_test.go'
      - 'backend/internal/handler/gateway_gemini_envelope_test.go'
      - 'backend/internal/handler/gemini_v1beta_handler.go'
      - 'backend/internal/repository/oauth_degradation_group_bindings*'
      - 'backend/internal/repository/procurement_cost_snapshot*'
      - 'backend/internal/repository/profit_operations.go'
      - 'backend/internal/repository/usage_log_repo*'
      - 'backend/internal/handler/dto/procurement_cost_snapshot*'
      - 'backend/internal/handler/usage_observer_test.go'
      - 'backend/migrations/392_usage_procurement_cost_snapshot.sql'
      - 'backend/internal/repository/concurrency_cache*'
      - 'backend/internal/repository/integration_harness_test.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - '.github/workflows/issue959-gateway-regression.yml'

permissions:
  contents: read

concurrency:
  group: issue959-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Temporary Draft evidence entry; archive it after the feature is accepted.
jobs:
  request-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: issue959
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d issue959"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUB2API_TEST_POSTGRES_DSN: postgres://fixture:fixture@127.0.0.1:15432/issue959?sslmode=disable
      SUB2API_TEST_REDIS_URL: redis://127.0.0.1:16379/0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Record exact head
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          go version | tee evidence/toolchain.txt
      - name: Request target accounting and legacy regression with race detector
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/handler/dto ./internal/repository \
            -run '^Test(GatewayIdentity|GatewayUsage|GatewayManagement|GatewayProtocol|GatewayDataImport|AccountGatewayDTO|NewAPIGateway|NewAPICostRequest|NewAPICostScale|UsagePlatformSnapshots|ProcurementSnapshot|ObserverProcurementSnapshot)' \
            -count=1 -v -timeout=10m 2>&1 | tee ../evidence/unit-race.log
          if grep -Eq -- 'no tests to run|--- SKIP:' ../evidence/unit-race.log; then
            exit 1
          fi
          grep -F -- '--- PASS: TestGatewayUsageWritersSnapshotRequestTarget' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestNewAPIGatewayCostsFollowRequestTargetWithoutSharedWrites' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestUsagePlatformSnapshotsSelectedAccount' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayManagementCreateValidatesBeforeWritesAndBindsExplicitGroups' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayManagementForwardingRemainsClosed' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolForwardUsesNativeBuildersAndSharedIdentity' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolOpenAIAuthoritativeAdmission' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolOpenAIRejectsFinalAuthorityChanges' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolOpenAIResponsesMappedWireModel' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolOpenAILegacyPassthroughKeepsWireModel' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolMessagesCandidatesStayRequestScoped' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolMessagesCandidateSourceRefreshesAfterWarmSnapshot' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolMessagesCandidateReadFailurePreservesLegacy' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolMessagesHandlerSchedulerToUsage' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolMessagesChannelMappingPreservesBindingModel' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolGeminiFreshAdmissionErrorEnvelope' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolGeminiForwardErrorResponseOwnership' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayProtocolAdmissionAllFamiliesKeepOneIdentity' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayManagementUpdateRequiresAtomicCapability' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayManagementRepositoryBindingGuard' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestGatewayDataImportIdentityValidation' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestAccountGatewayDTORedactsCallingKey' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestProcurementSnapshotMixedTargetsThroughUsageWriters' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestProcurementSnapshotAdminDTOAndUserPrivacy' ../evidence/unit-race.log
          grep -F -- '--- PASS: TestObserverProcurementSnapshotFollowsExistingAccountCostScope' ../evidence/unit-race.log
      - name: Shared account slots against isolated Redis
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=integration ./internal/repository \
            -run '^Test((ConcurrencyCacheSuite|AccountRepoSuite)$|GatewayAtomicUpdate)/^(TestGateway(TargetsShareAccountConcurrency|ManagementAtomicMembershipAndOAuthExclusion|RequestAdmissionReloadsGroupMembershipAndStatus|RequestCandidatesRequireLiveExplicitAnthropicGroup)|admin|account-service|bulk)$' \
            -count=1 -v -timeout=10m 2>&1 | tee ../evidence/concurrency-redis.log
          if grep -Eq -- 'no tests to run|--- SKIP:' ../evidence/concurrency-redis.log; then
            exit 1
          fi
          grep -F -- '--- PASS: TestConcurrencyCacheSuite/TestGatewayTargetsShareAccountConcurrency' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestAccountRepoSuite/TestGatewayManagementAtomicMembershipAndOAuthExclusion' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestAccountRepoSuite/TestGatewayRequestAdmissionReloadsGroupMembershipAndStatus' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestAccountRepoSuite/TestGatewayRequestCandidatesRequireLiveExplicitAnthropicGroup' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestGatewayAtomicUpdateOAuthInterleaving' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestGatewayAtomicUpdateRollbackAfterStagedFields' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestGatewayAtomicUpdateSuccessfulCommit' ../evidence/concurrency-redis.log
          grep -F -- '--- PASS: TestGatewayAtomicUpdateCallerTransactionRollback' ../evidence/concurrency-redis.log
      - name: Procurement snapshots and legacy profit accounting
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=integration ./internal/repository \
            -run '^(TestProcurementSnapshot|TestProfitOperationsPersistedProfitIndependentFromAccountDebit|TestProfitOperationsZeroLossUnknownAndCurrentConfiguration)' \
            -count=1 -v -timeout=10m 2>&1 | tee ../evidence/procurement-cost.log
          if grep -Eq -- 'no tests to run|--- SKIP:' ../evidence/procurement-cost.log; then
            exit 1
          fi
          grep -F -- '--- PASS: TestProcurementSnapshotAllInsertPathsAndImmutability' ../evidence/procurement-cost.log
          grep -F -- '--- PASS: TestProcurementSnapshotDurableReplayDoesNotRepriceOrRecharge' ../evidence/procurement-cost.log
          grep -F -- '--- PASS: TestProcurementSnapshotProfitUsesMixedRequestTargetsAndUnknowns' ../evidence/procurement-cost.log
          grep -F -- '--- PASS: TestProcurementSnapshotMigrationLeavesHistoryAndChargesUntouched' ../evidence/procurement-cost.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue959-first-slice-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
