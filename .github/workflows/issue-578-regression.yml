name: Issue 578 offline regression

on:
  push:
    branches: ['fix/issue-578-bps-usage-snapshot']
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/service/**'
      - 'backend/internal/handler/admin/openai_oauth_handler*'
      - 'backend/internal/handler/admin/issue_578*'
      - 'backend/internal/repository/account_codex_snapshot*'
      - 'backend/internal/repository/account_repo.go'
      - 'backend/internal/integration/issue578/**'
      - '.github/scripts/issue-578-storage.sh'
      - '.github/workflows/issue-578-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact tested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          sha256sum backend/internal/service/issue_578_regression_test.go > evidence/tests.sha256
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify toolchain
        run: go version | tee evidence/toolchain.txt
      - name: Prepare dependencies and loopback-only test runner
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go mod download all)
          cat > "$RUNNER_TEMP/issue-578-offline" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec sudo env PATH="$PATH" GOPATH="$(go env GOPATH)" \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            GOPROXY=off GOSUMDB=off \
            unshare --net bash -c 'ip link set lo up; exec "$@"' bash "$@"
          SH
          chmod +x "$RUNNER_TEMP/issue-578-offline"
          "$RUNNER_TEMP/issue-578-offline" ip -brief address | tee evidence/offline-network.txt
      - name: Review 2 behavioral RED on exact merged pre-fix source
        shell: bash
        env:
          REVIEW2_BASELINE: 60254aa9081f715161ef0c0ce3b6683e671b4798
        run: |
          set -euo pipefail
          red_tree="$RUNNER_TEMP/issue-578-review2-red"
          mkdir -p "$red_tree"
          git archive "$REVIEW2_BASELINE" | tar -x -C "$red_tree"
          cp backend/internal/service/issue_578_review2_regression_test.go "$red_tree/backend/internal/service/"
          echo "$REVIEW2_BASELINE" > evidence/review2-baseline-head.txt
          # The pinned source can require older module versions than HEAD.
          # Download the full selected graph, including transitive modules,
          # before the offline assertion can run on a cold module cache.
          (cd "$red_tree/backend" && go mod download all)
          set +e
          (cd "$red_tree/backend" && "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run '^TestIssue578Review2' -count=1 -v) > evidence/review2-red.log 2>&1
          result=$?
          set -e
          cat evidence/review2-red.log
          echo "$result" > evidence/review2-red-exit.txt
          test "$result" -ne 0
          if grep -Eq '\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:|--- SKIP:' evidence/review2-red.log; then exit 1; fi
          grep -F -- '--- FAIL: TestIssue578Review2PendingFieldObservationSurvivesRetry' evidence/review2-red.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-578-review2-red-${{ github.event_name }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Prove behavioral RED on pinned production baseline
        shell: bash
        env:
          BASELINE: 08d69a522c79a182fd681ead8fa4d848d9e1554e
        run: |
          set -euo pipefail
          red_tree="$RUNNER_TEMP/issue-578-baseline"
          mkdir -p "$red_tree"
          git archive "$BASELINE" | tar -x -C "$red_tree"
          echo "$BASELINE" > evidence/baseline-head.txt
          cp backend/internal/service/issue_578_regression_test.go "$red_tree/backend/internal/service/"
          (cd "$red_tree/backend" && go mod download all)
          set +e
          (cd "$red_tree/backend" && "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run '^TestIssue578(HeaderLatestValue|HeaderSerialAndRetry|QueryUsageSynchronizesNonzero|BPSTTLRefreshAndThrottle)$' -count=1 -v) > evidence/baseline-red.log 2>&1
          result=$?
          set -e
          cat evidence/baseline-red.log
          echo "$result" > evidence/baseline-exit.txt
          test "$result" -ne 0
          if grep -Eq '\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:' evidence/baseline-red.log; then
            echo 'Build/setup failures are not behavioral RED evidence'
            exit 1
          fi
          for name in HeaderLatestValue HeaderSerialAndRetry QueryUsageSynchronizesNonzero BPSTTLRefreshAndThrottle; do
            grep -F -- "--- FAIL: TestIssue578$name" evidence/baseline-red.log
          done
      - name: Exact head offline regressions and preserved controls
        if: '!cancelled()'
        shell: bash
        working-directory: backend
        run: |
          set -o pipefail
          "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run '^(TestIssue578|TestExcelBPSQuotaSnapshot|TestExcelBPS429|TestOpenAIQuotaRecovery|TestShouldRefreshOpenAICodexSnapshot|TestGetOpenAIUsage_SparkShadow|TestQueryUsageAgentIdentity|TestQueryUsageShadow|TestOpenAIQuotaAutoReset|TestShouldAutoPauseOpenAIAccountByQuota|TestEvaluateAccountSchedulingThreshold_OpenAI)' -count=1 -v 2>&1 | tee ../evidence/green-service.log
          "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/handler/admin -run '^TestIssue578|^TestOpenAI.*(Quota|Refresh)' -count=1 -v 2>&1 | tee ../evidence/green-admin.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-578-early-${{ github.event_name }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Review blockers behavioral RED on rejected head
        if: '!cancelled()'
        shell: bash
        env:
          REVIEW_BASELINE: 4f57d52e0f161f9dcd99ceb519cd4a102ad1394b
        run: |
          set -euo pipefail
          red_tree="$RUNNER_TEMP/issue-578-review-red"
          mkdir -p "$red_tree"
          git archive "$REVIEW_BASELINE" | tar -x -C "$red_tree"
          cp backend/internal/service/issue_578_review_regression_test.go "$red_tree/backend/internal/service/"
          (cd "$red_tree/backend" && go mod download all)
          set +e
          (cd "$red_tree/backend" && "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run '^TestIssue578Review' -count=1 -v) > evidence/review-red.log 2>&1
          result=$?
          set -e
          cat evidence/review-red.log
          echo "$REVIEW_BASELINE" > evidence/review-baseline-head.txt
          test "$result" -ne 0
          if grep -Eq '\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:' evidence/review-red.log; then exit 1; fi
          grep -F -- '--- FAIL: TestIssue578ReviewQueryDownstreamCannotRestampWindows' evidence/review-red.log
          grep -F -- '--- FAIL: TestIssue578ReviewWorkerPermanentErrorAndShutdown' evidence/review-red.log
      - name: Exact head concurrency regressions
        if: '!cancelled()'
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/issue-578-offline" go test -race -tags=unit ./internal/service -run '^TestIssue578' -count=3 -v 2>&1 | tee ../evidence/race.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-578-${{ github.event_name }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  shared-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare isolated PostgreSQL Redis and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql redis-server
          for attempt in 1 2 3 4 5; do
            if (cd backend && go mod download all); then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$attempt"
          done
      - name: Exact head and rejected-head shared storage regression
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          red_tree="$RUNNER_TEMP/issue-578-storage-red"
          mkdir -p "$red_tree"
          git archive 4f57d52e0f161f9dcd99ceb519cd4a102ad1394b | tar -x -C "$red_tree"
          mkdir -p "$red_tree/backend/internal/integration/issue578"
          cp backend/internal/integration/issue578/*test.go "$red_tree/backend/internal/integration/issue578/"
          review2_tree="$RUNNER_TEMP/issue-578-storage-review2-red"
          mkdir -p "$review2_tree"
          git archive 60254aa9081f715161ef0c0ce3b6683e671b4798 | tar -x -C "$review2_tree"
          cp backend/internal/integration/issue578/*test.go "$review2_tree/backend/internal/integration/issue578/"
          echo 60254aa9081f715161ef0c0ce3b6683e671b4798 > evidence/review2-baseline-head.txt
          # Each RED tree retains its pinned go.mod rather than HEAD's newer
          # graph. Prewarm both before entering the loopback-only namespace.
          for tree in "$red_tree" "$review2_tree"; do
            for attempt in 1 2 3 4 5; do
              if (cd "$tree/backend" && go mod download all); then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          done
          sudo env PATH="$PATH" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" \
            GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off GOSUMDB=off \
            unshare --net bash .github/scripts/issue-578-storage.sh "$PWD" "$red_tree" "$PWD/evidence" "$review2_tree"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-578-storage-${{ github.event_name }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
