name: WS API-key pool session isolation
on:
  pull_request:
    paths:
      - 'backend/internal/service/openai_ws_pool.go'
      - 'backend/internal/service/openai_ws_pool_session_test.go'
      - '.github/workflows/ws-pool-session.yml'
permissions:
  contents: read
concurrency:
  group: ws-pool-session-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real sockets reject old handshake reuse on the base
        env:
          BASE_SHA: dcb228eb8f077a52a223fb998bc0c83e073e7394
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/pool-base" "$BASE_SHA"
          cp backend/internal/service/openai_ws_pool_session_test.go "$RUNNER_TEMP/pool-base/backend/internal/service/"
          set +e
          (cd "$RUNNER_TEMP/pool-base/backend" && go test -json -tags=unit,issue905pool ./internal/service -run '^TestIssue905Pool' -count=1 -timeout=2m) > "$RUNNER_TEMP/pool-base.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pool-base.jsonl"
          python3 - "$result" "$RUNNER_TEMP/pool-base.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(l) for l in open(sys.argv[2]) if l.startswith('{')]
          assert int(sys.argv[1])==1
          names=['TestIssue905PoolSessionIsolation/'+h+'/capacity='+str(n) for h in ('session-id','session_id','thread-id','thread_id','conversation_id','conversation-id') for n in (1,2)]
          names+=['TestIssue905PoolPreferredSessionFence']
          assert not any(r.get('Action') in ('build-fail','skip') for r in rows)
          for name in names:
              assert any(r.get('Test')==name and r.get('Action')=='fail' for r in rows),name
              assert 'ISSUE905_' in ''.join(r.get('Output','') for r in rows if r.get('Test')==name),name
          PY
      - name: Candidate session isolation, connection reuse and pool controls
        run: |
          set -euo pipefail
          (cd backend && go test -race -json -tags=unit,issue905pool ./internal/service -run '^Test(Issue905Pool|OpenAIWSConnPool|OpenAIWSConnReaderLoop|NormalizeOpenAIWSRoutingAffinity|OpenAIGatewayService_Forward_WSv2StoreFalseDisableForceNewConn)' -count=1 -timeout=5m) | tee "$RUNNER_TEMP/pool-head.jsonl"
          python3 - "$RUNNER_TEMP/pool-head.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(l) for l in open(sys.argv[1]) if l.startswith('{')]
          names=['TestIssue905PoolSessionIsolation/'+h+'/capacity='+str(n) for h in ('session-id','session_id','thread-id','thread_id','conversation_id','conversation-id') for n in (1,2)]
          names+=['TestIssue905PoolPreferredSessionFence']
          assert not any(r.get('Action') in ('build-fail','fail','skip') for r in rows)
          for name in names:
              assert any(r.get('Test')==name and r.get('Action')=='pass' for r in rows),name
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ws-pool-session-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pool-*.jsonl
          if-no-files-found: error
