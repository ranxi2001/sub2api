name: Issue805 owner policy

on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/**'
      - '.github/scripts/prepare-moderation-red-fixtures.sh'
      - '.github/scripts/prepare-replay-red-fixtures.sh'
      - '.github/scripts/prepare-upstream-v0222-red-fixtures.py'
      - '.github/scripts/upstream-v0222-red-fixtures.txt'
      - '.github/workflows/issue805-owner-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue805-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install isolated Redis fixture
        run: |
          bash .github/scripts/ci-ubuntu-mirrors.sh
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Pinned production business RED in disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue805-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue805-evidence/candidate.txt"
          baseline=2cfdda4aeae1f482efd8a2ca6551b7f40f6e9d66
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$RUNNER_TEMP/issue805-red" "$EXPECTED_HEAD_SHA"
          cd "$RUNNER_TEMP/issue805-red"
          # Restore every changed production Go blob; retain Issue805 candidate tests.
          while IFS= read -r target; do
            case "$target" in *_test.go) continue ;; esac
            if git cat-file -e "$baseline:$target" 2>/dev/null; then
              mkdir -p "$(dirname "$target")"
              git show "$baseline:$target" > "$target"
              # A file removed by the candidate is untracked after restoration.
              # Include it in the baseline diff without staging different content.
              git add -N -- "$target"
              expected=$(git rev-parse "$baseline:$target")
              actual=$(git hash-object "$target")
              echo "$target baseline=present expected=$expected actual=$actual" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
              test "$expected" = "$actual"
            else
              # Candidate-only production must not survive in the baseline.
              # This directory is disposable; the candidate checkout stays clean.
              candidate=$(git rev-parse "$EXPECTED_HEAD_SHA:$target")
              rm -- "$target"
              echo "$target baseline=absent candidate=$candidate actual=absent" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
              test ! -e "$target"
            fi
          done < <(git diff --no-renames --name-only "$baseline" "$EXPECTED_HEAD_SHA" -- 'backend/**/*.go')
          git diff --exit-code "$baseline" -- 'backend/**/*.go' ':!backend/**/*_test.go'
          git diff --exit-code "$EXPECTED_HEAD_SHA" -- 'backend/**/*_test.go'
          baseline_tests=(
            backend/internal/handler/api_key_long_context_admission_test.go
            backend/internal/handler/api_key_long_context_ws_test.go
            backend/internal/handler/api_key_model_policy_write_permissions_test.go
            backend/internal/handler/gemini_cached_contents_billing_test.go
          )
          omission_tests=(
            backend/internal/handler/openai_409_omit_history_test.go
            backend/internal/handler/openai_409_readable_continuation_test.go
            backend/internal/handler/openai_409_http_rebuild_test.go
            backend/internal/handler/openai_409_shadow_http_test.go
            backend/internal/handler/openai_409_shadow_race_test.go
            backend/internal/handler/openai_409_ws_rebuild_test.go
            backend/internal/handler/openai_409_ws_oracle_test.go
            backend/internal/handler/openai_400_omit_history_test.go
            backend/internal/handler/openai_issue854_continuation_test.go
            backend/internal/handler/openai_issue854_upstream_test.go
            backend/internal/handler/openai_issue854_postgres_test.go
          )
          # Each fixture has one restoration owner. Fail if the shared manifest
          # grows to overlap either local list, before any fixture is modified.
          python3 - "$GITHUB_WORKSPACE/.github/scripts/upstream-v0222-red-fixtures.txt" "${baseline_tests[@]}" "${omission_tests[@]}" <<'PY'
          from pathlib import Path
          import sys
          shared = [p for p in Path(sys.argv[1]).read_text().splitlines() if p and not p.startswith('#')]
          local = sys.argv[2:]
          if len(shared) != len(set(shared)) or len(local) != len(set(local)):
              raise SystemExit('duplicate historical fixture owner')
          overlap = sorted(set(shared) & set(local))
          if overlap:
              raise SystemExit(f'shared/local fixture ownership overlap: {overlap}')
          if 'backend/internal/handler/usage_records_test.go' not in shared:
              raise SystemExit('usage_records fixture must retain its shared restoration owner')
          print(f'fixture ownership: shared={len(shared)} local={len(local)} intersection=empty')
          PY
          bash "$GITHUB_WORKSPACE/.github/scripts/exclude-later-http2-red-fixtures.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee "$RUNNER_TEMP/issue805-evidence/http2-exclusions.txt"
          # The HTTP2 helper calls prepare-upstream-v0222-red-fixtures.py via
          # prepare-free-fast-red-fixtures.sh. That shared owner alone removes
          # usage_records_test.go; verify its deletion without removing it again.
          target=backend/internal/handler/usage_records_test.go
          if git cat-file -e "$baseline:$target" 2>/dev/null; then exit 1; fi
          candidate_blob=$(git rev-parse "$EXPECTED_HEAD_SHA:$target")
          test "$(git cat-file -t "$candidate_blob")" = blob
          test ! -e "$target"
          test ! -L "$target"
          test "$(git diff --name-only --diff-filter=D "$EXPECTED_HEAD_SHA" -- "$target")" = "$target"
          echo "$target owner=shared baseline=absent candidate=$candidate_blob actual=absent" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
          # These unrelated context-policy tests require newer production symbols.
          # Use their baseline versions only in this disposable RED checkout so
          # compilation can reach the unchanged Issue805 business assertions.
          for target in "${baseline_tests[@]}"; do
            candidate_blob=$(git rev-parse "$EXPECTED_HEAD_SHA:$target")
            test "$(git hash-object "$target")" = "$candidate_blob"
            expected=$(git rev-parse "$baseline:$target")
            git show "$baseline:$target" > "$target"
            actual=$(git hash-object "$target")
            echo "$target owner=local test=baseline candidate=$candidate_blob expected=$expected actual=$actual" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
            test "$expected" = "$actual"
          done
          # The later omission fixtures require a Beta setting absent from this
          # baseline. The readable/task-rebuild fixtures import its settings.
          # Exclude this exact dependency set only in the old
          # Issue805 RED; GREEN and each feature's own TDD job retain them.
          for omission_test in "${omission_tests[@]}"; do
            if git cat-file -e "$baseline:$omission_test" 2>/dev/null; then exit 1; fi
            candidate_blob=$(git rev-parse "$EXPECTED_HEAD_SHA:$omission_test")
            test "$(git hash-object "$omission_test")" = "$candidate_blob"
            rm -- "$omission_test"
            test ! -e "$omission_test"
            echo "$omission_test owner=local baseline=absent candidate=$candidate_blob actual=absent" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
          done
          # The pinned HTTP2 exclusion helper above already handles the handler
          # fixture absent from this baseline; do not remove it a second time.
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-replay-red-fixtures.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee "$RUNNER_TEMP/issue805-evidence/replay-fixtures.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-moderation-red-fixtures.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee "$RUNNER_TEMP/issue805-evidence/moderation-fixtures.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-usage-sort-red-fixture.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee -a "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
          # The selected regression and its shared harness must remain exact
          # candidate blobs. The clean GREEN checkout retains all new tests.
          for target in backend/internal/handler/openai_issue805_delivery_test.go backend/internal/handler/openai_issue805_owner_policy_test.go backend/internal/handler/openai_issue805_ws_test.go backend/internal/handler/openai_issue715_recovery_test.go backend/internal/handler/openai_responses_failover_cancel_test.go; do
            expected=$(git rev-parse "$EXPECTED_HEAD_SHA:$target")
            actual=$(git hash-object "$target")
            echo "$target test=candidate expected=$expected actual=$actual" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
            test "$expected" = "$actual"
          done
          # Also prove the unchanged core blobs on the initial test-only head.
          for target in backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_account_scheduler.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_ws_agent_recovery.go; do
            expected=$(git rev-parse "$baseline:$target")
            actual=$(git hash-object "$target")
            echo "$target baseline=present expected=$expected actual=$actual" >> "$RUNNER_TEMP/issue805-evidence/red-blobs.txt"
            test "$expected" = "$actual"
          done
          git diff --stat > "$RUNNER_TEMP/issue805-evidence/red-diff.txt"
          set +e
          (cd backend && go test -tags=unit ./internal/handler -run '^TestIssue805HTTPCompletedHistorySelectsAlternative$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue805-evidence/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue805-evidence/red.log"
          test "$result" -ne 0
          if grep -Eiq 'build failed|no tests to run|undefined:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE|--- SKIP:' "$RUNNER_TEMP/issue805-evidence/red.log"; then exit 1; fi
          grep -q -- '--- FAIL: TestIssue805HTTPCompletedHistorySelectsAlternative/stream=false' "$RUNNER_TEMP/issue805-evidence/red.log"
          grep -q -- '--- FAIL: TestIssue805HTTPCompletedHistorySelectsAlternative/stream=true' "$RUNNER_TEMP/issue805-evidence/red.log"
          grep -q 'opt-out must dispatch complete A history to eligible B without clearing Redis' "$RUNNER_TEMP/issue805-evidence/red.log"
      - name: Exact clean candidate GREEN and race
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          for target in backend/internal/handler/http2_peer_reset_test.go backend/internal/service/http2_gateway_test_support.go; do
            if git cat-file -e "$EXPECTED_HEAD_SHA:$target" 2>/dev/null; then
              test "$(git hash-object "$target")" = "$(git rev-parse "$EXPECTED_HEAD_SHA:$target")"
            fi
          done
          cd backend
          go test -race -tags=unit ./internal/handler ./internal/service ./internal/config -run '^TestIssue805' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/issue805-evidence/green.log"
          if grep -Eiq 'no tests to run|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE' "$RUNNER_TEMP/issue805-evidence/green.log"; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue805-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue805-evidence/
